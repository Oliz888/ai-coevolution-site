<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Humanoid Robot Imaginaries — interactive co-mention network</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg:           #f7f8fa;
    --panel-bg:     #ffffff;
    --border:       #e5e7eb;
    --text:         #1f2937;
    --text-mid:     #4a5568;
    --text-light:   #7f8c8d;
    --accent:       #2563eb;
    --utopian:      #27ae60;
    --dystopian:    #c0392b;
    --mixed:        #e67e22;
    --neutral:      #7f8c8d;
    --hp:           #c0392b;
    --hp-bg:        #fbe9e7;
    --mp:           #b07a00;
    --mp-bg:        #fff7d6;
    --lp:           #2e7d32;
    --lp-bg:        #e7f5ec;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 13.5px;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  header {
    height: 84px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
  }
  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }
  header .subtitle {
    color: var(--text-mid);
    font-size: 11.5px;
    margin-top: 2px;
  }
  .toggle-group {
    display: inline-flex;
    background: #eef0f3;
    border-radius: 8px;
    padding: 3px;
    border: 1px solid var(--border);
  }
  .toggle-btn {
    border: none; background: transparent;
    padding: 7px 14px; font-size: 13px; font-weight: 600;
    color: var(--text-mid); cursor: pointer; border-radius: 6px;
    transition: all .12s;
  }
  .toggle-btn.active {
    background: var(--accent); color: white;
  }
  .toggle-btn:not(.active):hover { color: var(--text); background: #e0e3e8; }

  .control-group { display: flex; align-items: center; gap: 10px; }
  .control-group label { font-size: 12px; color: var(--text-mid); }
  .control-group input[type=range] { width: 110px; vertical-align: middle; }
  .control-group input[type=text] {
    padding: 6px 10px; font-size: 12.5px; border: 1px solid var(--border);
    border-radius: 6px; width: 180px; outline: none;
  }
  .control-group input[type=text]:focus { border-color: var(--accent); }

  .stats {
    margin-left: auto; font-size: 11.5px; color: var(--text-light);
    text-align: right; line-height: 1.4;
  }

  /* ---------- layout ---------- */
  .layout {
    display: grid; grid-template-columns: minmax(0, 1fr) 420px;
    height: calc(100vh - 84px - 42px);
    min-width: 800px;
  }
  #network {
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    position: relative;
    min-height: 500px;
  }
  aside {
    background: var(--panel-bg);
    overflow-y: auto;
    padding: 22px 22px 60px;
  }
  aside .placeholder {
    color: var(--text-light); font-style: italic;
    margin-top: 90px; text-align: center;
    font-size: 13px;
  }
  aside h2 { margin: 0 0 4px; font-size: 18px; line-height: 1.25; }
  aside .meta-row {
    display: flex; gap: 10px; align-items: center; margin: 8px 0 18px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 12px;
    font-size: 11px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase;
  }
  .badge.utopian   { background: var(--utopian);   color: #fff; }
  .badge.dystopian { background: var(--dystopian); color: #fff; }
  .badge.mixed     { background: var(--mixed);     color: #fff; }
  .badge.neutral   { background: #eef0f3; color: var(--text-mid); }

  .count-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; background: #eef0f3; border-radius: 12px;
    font-size: 11.5px; color: var(--text-mid); font-weight: 600;
  }

  .section-title {
    text-transform: uppercase; font-size: 10.5px; letter-spacing: .8px;
    color: var(--text-light); font-weight: 700;
    margin: 22px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px;
  }
  .topic-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .topic-chip {
    padding: 4px 9px; font-size: 11.5px; border-radius: 12px;
    background: #eef0f3; color: var(--text-mid);
    border: 1px solid transparent;
  }
  .topic-chip.utopian   { background: rgba(39,174,96,.12);  color: #1e7e34; border-color: rgba(39,174,96,.25); }
  .topic-chip.dystopian { background: rgba(192,57,43,.10);  color: #8b1a0e; border-color: rgba(192,57,43,.22); }
  .topic-chip.feature   { background: rgba(37,99,235,.08);  color: #1d4ed8; border-color: rgba(37,99,235,.20); }

  .feature-row {
    display: flex; align-items: center; gap: 10px;
    margin: 7px 0; font-size: 12.5px;
  }
  .feature-row .name { width: 145px; color: var(--text-mid); }
  .feature-row .check {
    width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; color: white;
  }
  .feature-row.yes .check { background: var(--accent); border-color: var(--accent); }
  .feature-row.no  .check { background: #f3f4f6; }
  .feature-row.no  { color: var(--text-light); }
  .feature-row.no .name { color: var(--text-light); text-decoration: line-through; text-decoration-color: var(--border); }

  .paper-card {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 9px; background: #fafbfc;
    border-left: 4px solid var(--neutral);
  }
  .paper-card.high   { border-left-color: var(--hp); background: var(--hp-bg); }
  .paper-card.medium { border-left-color: var(--mp); background: var(--mp-bg); }
  .paper-card.low    { border-left-color: var(--lp); background: var(--lp-bg); }
  .paper-key { font-weight: 700; color: var(--text); font-size: 13px; }
  .paper-priority {
    font-size: 9.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle;
  }
  .paper-priority.high   { background: var(--hp); color: white; }
  .paper-priority.medium { background: var(--mp); color: white; }
  .paper-priority.low    { background: var(--lp); color: white; }
  .paper-meta { color: var(--text-mid); font-size: 11.5px; margin: 2px 0 6px; }
  .paper-excerpt {
    font-size: 12px; color: var(--text); line-height: 1.45;
    background: rgba(255,255,255,.65); padding: 7px 9px; border-radius: 4px;
    border: 1px solid rgba(0,0,0,.04);
  }
  .paper-flag {
    display: inline-block; font-size: 10px; padding: 1px 6px; margin-right: 4px;
    border-radius: 3px; font-weight: 600;
  }
  .paper-flag.desire { background: rgba(192,57,43,.14); color: #8b1a0e; }
  .paper-flag.invent { background: rgba(37,99,235,.12); color: #1d4ed8; }

  /* ---------- Wikipedia / Wikidata block ---------- */
  .wiki-card {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; background: #fafbfc;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .wiki-thumb {
    flex: 0 0 96px; width: 96px; height: 96px; object-fit: cover;
    border-radius: 6px; background: #f3f4f6;
  }
  .wiki-body { flex: 1 1 auto; min-width: 0; }
  .wiki-title {
    font-weight: 700; font-size: 14px; color: var(--accent);
    text-decoration: none;
  }
  .wiki-title:hover { text-decoration: underline; }
  .wiki-link-icon { font-size: 11px; margin-left: 4px; opacity: .7; }
  .wiki-desc {
    font-size: 12px; color: var(--text-mid); font-style: italic;
    margin-top: 2px;
  }
  .wiki-extract {
    margin-top: 8px; font-size: 12px; color: var(--text); line-height: 1.5;
    background: white; padding: 8px 10px; border-radius: 4px;
    border: 1px solid var(--border);
  }
  .wiki-meta-table {
    margin-top: 12px; width: 100%; border-collapse: collapse;
    font-size: 12px;
  }
  .wiki-meta-table th, .wiki-meta-table td {
    border-bottom: 1px solid var(--border); padding: 5px 6px; text-align: left;
    vertical-align: top;
  }
  .wiki-meta-table th {
    width: 130px; color: var(--text-mid); font-weight: 600;
    background: rgba(0,0,0,.015);
  }
  .wiki-meta-table td { color: var(--text); }
  .wiki-no-match {
    border: 1px dashed var(--border); border-radius: 6px;
    padding: 10px 12px; font-size: 12px;
    color: var(--text-light); font-style: italic;
    background: #fafbfc;
  }

  /* ---------- Research attributes ---------- */
  .research-attrs {
    margin-top: 4px;
  }
  .attr-group {
    margin-bottom: 10px;
  }
  .attr-label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: var(--text-light); margin-bottom: 4px;
  }
  .attr-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .attr-chip {
    display: inline-block; padding: 3px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
    border: 1px solid transparent;
  }
  .attr-chip.material   { background: #e8eaf6; color: #283593; border-color: #c5cae9; }
  .attr-chip.entity     { background: #e0f2f1; color: #00695c; border-color: #b2dfdb; }
  .attr-chip.embodiment { background: #fce4ec; color: #880e4f; border-color: #f8bbd0; }
  .attr-chip.capability { background: #fff3e0; color: #e65100; border-color: #ffe0b2; }
  .attr-chip.role       { background: #f3e5f5; color: #6a1b9a; border-color: #e1bee7; }
  .attr-chip.mind       { background: #e1f5fe; color: #01579b; border-color: #b3e5fc; }
  .attr-chip.gender     { background: #fce4ec; color: #880e4f; border-color: #f8bbd0; }
  .attr-chip.appears    { background: #e8f5e9; color: #2e7d32; border-color: #c8e6c9; }
  .attr-chip.quality    { background: #fff8e1; color: #f57f17; border-color: #ffecb3; }
  .attr-chip.based      { background: #efebe9; color: #4e342e; border-color: #d7ccc8; }
  .research-none {
    font-size: 11.5px; color: var(--text-light); font-style: italic;
  }

  /* footer in side panel showing all papers in corpus when nothing selected */
  #legend {
    margin-top: 30px; padding-top: 18px;
    border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-mid);
  }
  #legend code { font-family: "SF Mono", Menlo, monospace; font-size: 10.5px; }

  /* ---------- site navigation ---------- */
  .site-nav {
    background: #0b1120; padding: 0 24px; display: flex;
    align-items: center; height: 42px; gap: 20px; flex-shrink: 0;
  }
  .site-nav .brand {
    font-weight: 800; font-size: 14px; color: #f1f5f9;
    text-decoration: none; letter-spacing: -.3px;
  }
  .site-nav .brand span { color: #3b82f6; }
  .site-nav a {
    color: #94a3b8; text-decoration: none; font-size: 12.5px;
    font-weight: 600; padding: 4px 0; border-bottom: 2px solid transparent;
    transition: all .15s;
  }
  .site-nav a:hover { color: #f1f5f9; }
  .site-nav a.active { color: #f1f5f9; border-bottom-color: #3b82f6; }
</style>
</head>

  <div class="control-group">
    <label for="min-count">Min&nbsp;mentions:</label>
    <input type="range" id="min-count" min="1" max="15" value="2" step="1">

    <input type="text" id="search" placeholder="Search nodes…">

</header>

    </div>
    <div id="legend"></div>
  </aside>
</div>

<script>
const PAYLOAD = {"meta": {"n_papers": 64, "n_chars": 294, "n_works": 392, "n_char_edges": 2832, "n_work_edges": 3665}, "motifs": ["utopian", "dystopian", "uprising", "companion", "threat", "labor", "sex_gender", "uncanny", "singularity", "surveillance", "cognition", "maker_anxiety", "embodied_humanoid", "real_counterpart", "inspired_research", "cited_in_policy"], "valence_of_motif": {"utopian": "utopian", "dystopian": "dystopian", "uprising": "dystopian", "companion": "utopian", "threat": "dystopian", "labor": null, "sex_gender": null, "uncanny": "dystopian", "singularity": null, "surveillance": "dystopian", "cognition": null, "maker_anxiety": "dystopian", "embodied_humanoid": null, "real_counterpart": null, "inspired_research": null, "cited_in_policy": null}, "papers": {"Alacovska2025": {"key": "Alacovska2025", "authors": "Ana Alacovska", "year": 2025, "title": "Sci-fi Capital and Humanoid Robotics: Conjuring the Speculative Value of Not-Yet-Existing Technologies", "venue": "Sociology (SAGE), DOI 10.1177/00380385251380978", "priority": "high", "summary": "Background: in financialized capitalism, economic value has become decoupled from material production, and tech entrepreneurs increasingly mobilize SF imagery to confer speculative value on technologies that do not yet work. Research question: how do humanoid-robotics entrepreneurs deploy SF tropes, narratives, and world-building as a 'sci-fi capital' to conjure speculative value, attract investors, and frame humanoid robots as the inevitable future? Method: theoretical synthesis (Baudrillard, Bourdieu, Beckert's fictional expectations, Jasanoff's sociotechnical imaginaries, Jameson's utopian SF) combined with a multi-case discourse analysis of leading humanoid-robotics ventures and their pitch materials, founders' interviews, social-media posts, and demo videos. Data: case studies of Replika (chatbot inspired by Black Mirror's 'Be Right Back'), Tesla Optimus, Figure AI, 1X, Apptronik Apollo, Agility Robotics Digit, Sanctuary AI, plus quotes from Jeff Bezos (self-declared Trekkie), Elon Musk, Jill Lepore, Hartmann 2024 on Silicon Valley sci-fi influence. Findings: 'sci-fi capital' is a genre-specific subtype of cultural capital that entrepreneurs incantatorily deploy to materialize 'present futures' — humanoid robotics ventures use SF iconography (Terminator, I, Robot, Real Humans, Blade Runner, Black Mirror) to render not-yet-existing tech 'viable, desirable, and worthy of investment.' Limitations: theoretical/qualitative; no quantitative valuation data; case selection focuses on US/Silicon Valley; no longitudinal funding-round analysis.", "relevance": "Cornerstone for H4 (Institutional Uptake) — gives the most explicit theoretical and case-based account of how SF narratives convert into actual VC funding for humanoid robotics. Strong support for H1 (Temporal Lead) — argues SF precedes and conjures the technologies. Method reuse: 'sci-fi capital' as a measurable construct (count of SF references in pitch decks, tweets, S-1 filings, NSF grant abstracts) directly informs our patent/grant text-mining; the Replika→Black Mirror case study is the cleanest fiction→product pipeline in the literature. Character harvest: Replika personas, Tesla Optimus, Figure 02, 1X NEO, Apollo, Digit, Black Mirror's Be Right Back robot, Real Humans synths, Ava (Ex Machina), Westworld hosts."}, "Aleksander2017": {"key": "Aleksander2017", "authors": "Igor Aleksander", "year": 2017, "title": "Partners of humans: a realistic assessment of the role of robots in the foreseeable future", "venue": "Journal of Information Technology 32(1)", "priority": "high", "summary": "Background: media headlines and futurologists (Vinge, Kurzweil, Goertzel) routinely predict a robotic 'singularity' that will displace humans, conflating SF tropes with engineering reality; meanwhile actual robotics labs report far more modest progress. Research question: what is the actual level of competence achieved in robotics research labs worldwide, and is the singularity/AGI narrative — heavily inflected by SF — a category error that misleads policy and public expectations? Method: review essay by a leading neural-networks pioneer; surveys EU/US/Japan/China cognitive-robotics programmes (POETICON++, CogIMON, RobDREAM, DREAM, SARAFun, TIMESTORM, socSMCs, Smokebot, SWEEPER, etc.) plus discussion of the singularity argument and machine consciousness. Data: no formal corpus — synthesizes funded projects (with budgets and durations), media headlines (UK Mail Online, Yahoo Tech News, Live Science), Vinge's 1983/1993 SF-derived singularity argument, and Aleksander's own 1995-onward 'machine consciousness' research. Findings: distinguishes 'algorithmic' machine intelligence from 'life-need' human intelligence — a Rylean category error underlies singularity claims; current cognitive-robotics labs (Stanford, MIT/CSAIL, CITRIS, Columbia, Maryland, Osaka/Ishiguro, China's Brain-Inspired Intelligence Center) work on assistive partnership rather than human replacement; education/upskilling, not job loss, is the realistic policy frame. Limitations: review/opinion piece, no quantitative method, anglophone framing, 2017 vintage (predates LLM-driven humanoid wave).", "relevance": "Strongly supports H1 (Temporal Lead) and H4 (Institutional Uptake) by quantitatively naming EU funded programs (POETICON++ €5.1M, CogIMON €5.6M, etc.) — these are exactly the grant abstracts our project will mine. Strongly supports H3 (Selective Alignment): explicitly identifies which SF tropes (singularity, killer robot, conscious robot) misdiffuse vs. which (assistive partnership) align with research practice. Method reuse: Aleksander's 5-axiom consciousness framework + 'algorithmic vs. life-need' typology is a candidate label set for grant/patent classification. Character harvest: HAL 9000, the singularity-AI archetype, iCub humanoid (real), NAO real robot, plus Vinge/Kurzweil/Good as theoretical figures."}, "AtanasoskiVora2019": {"key": "AtanasoskiVora2019", "authors": "Neda Atanasoski, Kalindi Vora", "year": 2019, "title": "Surrogate Humanity: Race, Robots, and the Politics of Technological Futures (Epilogue: On Technoliberal Desire, Or Why There Is No Such Thing as a Feminist AI)", "venue": "Duke University Press, ISBN 978-1-4780-0312-3", "priority": "high", "summary": "Background: contemporary humanoid robots and AI products (RealDoll/Harmony, Replika, Pepper) are pitched as 'better-than-human' surrogates that promise to free humans from menial/affective labour, while reproducing colonial/racial/gendered hierarchies. Research question: how does the 'surrogate effect' — fictional and engineering imaginations of artificial servants standing in for racialized/gendered subjects — constitute the politics of technological futures? Method: critical theory + cultural studies + technology studies, drawing on feminist STS, postcolonial theory, and critical race theory; close readings of corporate AI/robot launches alongside SF texts and historical surrogacy structures (slavery, domestic service, sex work). Data: case studies including RealBotix's RealDoll/Harmony (Matt McMullen), Pepper, Jibo, Sophia (Hanson Robotics), Hitchhiker's Guide to the Galaxy 'real human' jokes, Battlestar Galactica's Cylons, plus historical analogues; New York Times Harmony video, McMullen interviews, Sophia's 'I will destroy humans' moment. Findings: the dream of 'feminist AI' or fully responsible humanoid surrogates is foreclosed by the technoliberal frame itself — surrogacy reproduces the racial/gendered hierarchies it was supposed to displace; humanoid sex robots are continuous with histories of imagined subordinate Others. Limitations: theoretical-critical, no large-scale empirical content analysis, US-centric, qualitative.", "relevance": "Strongly supports H3 (Selective Alignment) on the affective/social-role dimension — surrogacy is precisely the trope H3 predicts will migrate most strongly. Supports H4 (Institutional Uptake): RealBotix, Boston Dynamics, Hanson Robotics commercialization arc is an explicit fiction→funding→product pipeline. Method reuse: the 'surrogate effect' framework (echoed in Alacovska2025) is a candidate coding axis for race/gender dimensions in our humanoid trope tagging. Character harvest: Harmony (RealBotix), Sophia (Hanson Robotics), Jibo, Pepper, Cylons (Battlestar Galactica), Mars/Marvin (Hitchhiker's Guide), Bicentennial Man (Asimov), plus the long historical lineage of imagined subordinate humanoids."}, "BassettEtAl2013": {"key": "BassettEtAl2013", "authors": "Caroline Bassett, Ed Steinmueller, George Voss", "year": 2013, "title": "Better Made Up: The Mutual Influence of Science Fiction and Innovation", "venue": "Nesta Working Paper 13/07 (March 2013), www.nesta.org.uk/wp13-07 (ISSN 2050-9820)", "priority": "high", "summary": "Background: the assumption that SF predicts and inspires innovation is widespread (Buzz Aldrin's Mars-cycler, Clarke's communication satellite, Neuromancer's cyberspace), but treated as 'commonplace' rather than studied with a model. Research question: what is the actual structure of the multi-directional influence pathways between SF and real-world science/technology innovation, and how can they be traced empirically? Method: three-pronged study commissioned by Nesta (UK innovation foundation) — (i) interdisciplinary literature survey on SF as genre + audience appropriation; (ii) prototype database of 'transformational paths' connecting SF works to innovations; (iii) experimental web crawl tool (built by Andy Holyer) using digital-humanities techniques to trace fictional-idea diffusion at scale. Data: prototype Crawl-tool experiments + ~50 transformational pathway case studies (Neuromancer→cyberspace, Star Trek communicator→mobile phone, Snow Crash→Second Life, Kraftwerk→robotics, etc.); interviews and document analysis. Findings: linear 'SF→invention' transmission is the exception, not the rule; influence is multi-directional and operates through persuasion, desire, sub-cultural identification, genre conventions, and policy framings; SF has implications for foresight, horizon scanning, public understanding of science, and STI governance. Limitations: working paper (pre-publication), prototype tools, UK/anglophone focus, 2013 cutoff.", "relevance": "Cornerstone reference for H1 (Temporal Lead) and H4 (Institutional Uptake) — the working paper IS the methodological template for our entire project: a Nesta-funded study attempting exactly the SF-to-innovation pathway tracing we are building. Strongly supports H3 (Selective Alignment) by formalizing the role of genre conventions and persuasion. Method reuse (extremely high): the prototype 'transformational paths' database + web-crawl tool is the closest precedent for our Golden Table; the multi-directional influence model is the conceptual backbone. Character harvest: Neuromancer's Wintermute/Case, Snow Crash's Hiro Protagonist, Star Trek tricorder/communicator, plus the broader Foresight literature (Aldrin's transporter, Verne's submarine)."}, "Belsunces2025": {"key": "Belsunces2025", "authors": "Andreu Belsunces", "year": 2025, "title": "Sociotechnical Fictions: The Performative Agencies of Fiction in Technological Development", "venue": "Science & Technology Studies (preprint, 2025)", "priority": "high", "summary": "Background: STS has a rich vocabulary for technology-future relations (imaginaries, expectations, promises, metaphors, anticipatory practices) but lacks a precise concept for the fiction-like narrative practices that materially shape emerging technologies. Research question: how do 'sociotechnical fictions' — distinct from literary or cinematic fictions — perform agency within technosciences to materialize non-existent imaginary entities? Method: literature review + comparative conceptual analysis of related STS concepts + multi-case discourse/document analysis from a performative actor-network-theory perspective. Data: case studies of the metaverse, algorithmic counterfactuals, the cloud, artificial intelligence, Theranos, and WeWork — drawing on press coverage, prospectuses, demo videos, and STS scholarship. Findings: sociotechnical fictions have four interlinked agencies — epistemic (resolve ambiguity), aesthetic (challenge possibility), affective (engage anticipation/emotion), and normative (frame paths and value); they are 'incantatory' (cf. Wilbanks, Tambiah) — they produce what they predict; politically, their agencies are unevenly distributed (e.g., Theranos demonstrating epistemically toxic effects). Limitations: conceptual paper, multi-case but no formal coding/inter-rater; non-empirical data sources; preprint version.", "relevance": "Strongly supports H1 (Temporal Lead): the 'incantatory' fiction-precedes-tech framing is the theoretical scaffold for our temporal-lead hypothesis. Strongly supports H4 (Institutional Uptake): explicitly tracks how fictions become legitimacy-conferring devices that attract funding (Theranos/WeWork as cautionary cases). Method reuse: the 4-agency taxonomy (epistemic / aesthetic / affective / normative) is a clean coding scheme for tagging fictional-trope mentions in grant abstracts and patents — complementary to Osawa's 9-element scheme. Characters/works: theoretical exemplars rather than fictional characters — but provides the STS framework we need to theorize how humanoid SF tropes operate when cited in NSF/USPTO documents."}, "Clarke1993": {"key": "Clarke1993", "authors": "Roger Clarke", "year": 1993, "title": "Asimov's Laws of Robotics: Implications for Information Technology (Part 1)", "venue": "IEEE Computer 26(12)", "priority": "high", "summary": "Background: writing after Asimov's 1992 death, Clarke argues Asimov's robot stories are not just literature but gedankenexperiments about controlling semi-autonomous machines — and because many IT applications exhibit robotic characteristics, the problems Asimov identified are directly relevant to working information technologists. Research question: do Asimov's Three (later Four) Laws vindicate the idea that robotic/IT systems can be reliably controlled through simple ethical rules? Method: historical narrative + textual analysis of 45 years of Asimov's fiction, tracing the evolution of the Laws through specific stories. Data: no empirical dataset — full Asimov robot corpus (stories from 'Runaround' 1942 through Robots and Empire 1985), plus secondary literature on robotics history (Frude, Geduld & Gottesman, Engelberger). Findings (Part 1): surveys the golem/Frankenstein/R.U.R. lineage of the 'humanoid' trope; defines robot via programmability, mechanical capability, flexibility; shows how Asimov's Laws migrated into real engineering practice (Engelberger cites reading I, Robot as a teenager). Limitations: Part 1 is conceptual/historical only; empirical/ethical implications are deferred to Part 2, and the analysis is Asimov-centric with no quantification of reach.", "relevance": "Strongly supports H1 (Temporal Lead) with the concrete case of Engelberger (builder of Unimate, the first industrial robot in 1958) explicitly attributing his vocation to reading I, Robot — a documented fiction→engineering pipeline. Supports H3 via the Three Laws as a selectively-aligning social/ethical trope that migrated from fiction into real robot ethics policy. Method reuse: Clarke's typology (programmability / mechanical capability / flexibility) can serve as coding categories for fictional robots in our Books+Comics+Films corpus. Characters/works to seed the Books subcorpus: the complete Asimov robot cycle; R.U.R.; Frankenstein; the golem myth; 2001's HAL; Star Wars's R2-D2 (Clarke uses these as benchmarks of 'robot personality')."}, "Denia2025": {"key": "Denia2025", "authors": "Elena Denia", "year": 2025, "title": "AI narratives model: Social perception of artificial intelligence", "venue": "Technovation 146 (2025) 103266 (Elsevier)", "priority": "high", "summary": "Background: public attitudes toward AI are shaped by both individual experience and dominant cultural narratives — but the field has typically used a binary utopian/dystopian framing that obscures the spectrum of AI imaginaries. Research question: what types of AI stories predominate in popular culture, and do audiences with different levels of AI engagement align with different positions on that narrative spectrum? Method: theoretical model construction (apocalypse / assistance / transcendence triadic structure with Pandora's Box and Social Progress frames) + two empirical studies — (a) review of the 300 highest-grossing SF films in North America, (b) focus-group discussions with three audience tiers categorized by AI proximity. Data: top-300 highest-grossing SF films in North America (Box Office Mojo); MIT-published focus-group dataset (Denia & Durant 2024) with protocols, transcripts, recordings — three audience groups (general public / interested public / engaged public) sorted by AI engagement. Findings: SF films cover the entire narrative spectrum rather than clustering at extremes; audiences progressively shift along that spectrum — general public → apocalyptic, interested public → assistance, engaged public → improvement/transcendence; greater AI engagement correlates with more nuanced/positive narrative positioning. Limitations: US/anglophone film sample; box-office bias; focus-group sample limited; cross-sectional; no longitudinal narrative-shift tracking; AI-proximity self-categorization.", "relevance": "Strongly supports H3 (Selective Alignment): the apocalypse / assistance / transcendence triad is a candidate label set for our humanoid-robot trope coding. Strongly supports H4 (Institutional Uptake): documents that audience-engagement level correlates with narrative positioning, the missing link between SF→public→funding-environment. Method reuse (high): top-300 highest-grossing SF films is a ready-made sampling frame for our IMDb Films layer; the three-tier audience taxonomy (general/interested/engaged) parallels our grant/patent applicants. Characters: 300 SF films would yield extensive character lists overlapping with Saffari 2021's 108 FRs."}, "DoeringPoeschl2019": {"key": "DoeringPoeschl2019", "authors": "Nicola Döring, Sandra Poeschl", "year": 2019, "title": "Love and Sex with Robots: A Content Analysis of Media Representations", "venue": "International Journal of Social Robotics 11(4)", "priority": "high", "summary": "Background: David Levy (2007) predicted normalized human-robot intimate relationships by 2050, but most public knowledge of love/sex with robots comes through media representations rather than direct experience. Research question: based on Sexual Script Theory, how are intimate human-robot relationships portrayed in fictional and non-fictional media — specifically the human partner, the robot partner, and the relationship itself? Method: quantitative media content analysis with a 32-variable codebook applied to a stratified quota sample; both fictional (fan fiction, manga/comics, movies/TV) and non-fictional (newspaper/magazine articles, YouTube informational videos) subsamples; inter-coder reliability calculated. Data: N = 710 media examples (1927–2014), 48% non-fictional / 52% fictional, drawn from fan-fiction servers, manga portals, IMDb, Nexis, YouTube; quotas of ~50 per media type; 290 newspaper/magazine articles, 50 YouTube videos, 270 fan fiction stories, 50 mangas/comics, 50 movies/TV series. Findings: media typically portray the human partner as a heterosexual man with social disadvantages and the robot as a humanoid female sex robot; non-fictional media emphasize sexual aspects, fictional media emphasize emotional/cohabitation/procreation aspects; both reveal stereotypical gender roles and heteronormativity. Limitations: English-language only, 1927–2014 cutoff (predates current sex-robot market boom), no audience-effect measurement, sex-work and disability framings undercoded.", "relevance": "Strongly supports H3 (Selective Alignment) on the affective/sexual humanoid dimension — gives the cleanest empirical evidence that gendered/sexual tropes migrate strongly across fictional and non-fictional media. Supports H2 (Media Sequencing) — directly compares fan-fiction, manga/comics, movies/TV, news, and YouTube as distinct media layers (manga/comics are explicitly included, perfect for our Comics layer). Method reuse (high): 32-variable codebook + Sexual Script Theory framing is portable to our Books/Comics/Films layer for affective/intimate-relation tropes; the quota sampling design (50 per media type) is a template for balanced cross-media corpus construction. Character harvest: Maria/Maschinenmensch (Metropolis), Dors Venabili (Asimov's Forward the Foundation), Real Humans synths, Ava (Ex Machina), Harmony (Realbotix), Roxxxy Gold (TrueCompanion)."}, "Gibson2017": {"key": "Gibson2017", "authors": "Rebecca Gibson", "year": 2017, "title": "More Than Merely Human: How Science Fiction Pop-Culture Influences Our Desires for the Cybernetic", "venue": "Sexuality & Culture 21", "priority": "high", "summary": "Background: AI-based companions and cybernetic augmentation are now real markets, yet scholarly accounts of how SF stories cultivate the desire to love/sleep with humanoids are sparse. Research question: how do SF pop-culture narratives about androids, replicants, and bio-engineered near-humans shape contemporary cybercultural desires for non-human companionship and medical cybernetic augmentation? Method: anthropological/cultural-studies essay combining close readings of SF texts with Freud, Lévi-Strauss, and Levy on love-sex-robots; explicitly compares fictional scenarios with real-world cyber-tech trends. Data: no empirical corpus — analytical sample includes Dick's Do Androids Dream of Electric Sheep? (1968) and its film adaptation Blade Runner, Star Trek: TNG (1987–94, esp. Lt. Cmdr Data episodes), Sony PlayStation 'Kara' (Quantic Dream), Margaret Atwood's MaddAddam trilogy ('Crakers'), David Mitchell's Cloud Atlas ('Fabricants'), plus references to Asimov, Spike Jonze's Her, and real AI assistants. Findings: SF storytellers function as 'pseudo-deities' creating attractive android Others; uncanniness and authenticity-anxiety drive both romantic attraction to and rejection of humanoid partners; the same logic explains the rising market for AI companions and prosthetic cyborg augmentation. Limitations: single-author essay; selective US/UK/anglophone canon; no audience or market data; theoretical/anecdotal.", "relevance": "Strongly supports H3 (Selective Alignment) on the affective/sexual dimension of humanoidness — exactly H3's predicted migration channel. Supports H1 in the section on SF's 'predictive' role for AI companions. Method reuse: the bricoleur/engineer/pseudo-deity typology of storytellers can serve as a coding axis for our Books corpus; the Freudian 'uncanny' framing complements Mori's uncanny-valley measurement in HRI patents. Character harvest: Rachael Rosen, Pris Stratton, Rick Deckard (Blade Runner / Do Androids); Lt. Cmdr Data, Lal, Tasha Yar (Star Trek TNG); Kara (PS3 demo); Crakers (Atwood); Fabricants (Mitchell, Cloud Atlas); Samantha (Her, implied) — all primary candidates for the Books/Films/Comics corpora."}, "Goode2018": {"key": "Goode2018", "authors": "Luke Goode", "year": 2018, "title": "Life, but not as we know it: A.I. and the popular imagination", "venue": "Culture Unbound 10(2), 185–207 (Linköping University Electronic Press)", "priority": "high", "summary": "Background: AI is widely perceived as fast-moving, future-shaping technology, and futuristic imagery (singularity, killer robots, Pinocchio androids) saturates popular media — but critical-future-studies has not yet evaluated how these 'evocative stories' shape the futural public sphere. Research question: how do three intertwined strands of public discourse — (i) mainstream SF representations of AI, (ii) popular media events around real-world AI developments, (iii) contemporary futurology of the singularity — shape the popular imagination, and how can the resulting narratives be critically appreciated rather than dismissed? Method: critical-cultural-studies essay grounded in 'futures literacy' (Riel Miller), the technological/digital sublime (Nye, Mosco), and the Freudian uncanny; selective close readings of canonical SF films/TV plus high-profile real-world media events. Data: no formal corpus — illustrative samples include R.U.R., Metropolis, 2001: A Space Odyssey/HAL, I, Robot/Asimov's Three Laws, Terminator (1984–), The Matrix (1999), Blade Runner, Spielberg's A.I. (2001), Ex Machina, Her, Westworld, plus media events around DeepMind's AlphaGo, Sophia (Hanson Robotics), Tay (Microsoft chatbot), and the Kurzweil/Bostrom singularity discourse. Findings: AI narratives draw on the 'technological sublime' and the Freudian uncanny — they deliver excitement and creepy non-life affect simultaneously; rather than dismissing the clichés, critical futures studies should either repurpose them as gateways to debate or generate new evocative narratives that expand imagination and critical reflection. Limitations: essay-form, anglophone canon, no audience/reception data, qualitative.", "relevance": "Strongly supports H3 (Selective Alignment): articulates which AI tropes (machine uprising, Frankenstein complex, sublime/uncanny) actually circulate in public discourse vs. which fade. Supports H4 (Institutional Uptake) via the 'futural public sphere' framework — links narrative repertoires to public engagement with AI policy. Method reuse: 'evocative stories' as a coding category (gateway vs. clichéd vs. new) maps onto our trope-classification scheme; the technological-sublime + uncanny axes are candidate trope-tags. Character harvest: HAL, Terminator/Skynet, Roy Batty + Deckard (Blade Runner), Frankenstein's creature, R.U.R.'s robots, Wall-E, Data, Robby (Lost in Space), Spielberg's David (A.I.), Ava (Ex Machina), Samantha (Her), Westworld hosts, Sophia, Tay."}, "HudsonEtAl2021": {"key": "HudsonEtAl2021", "authors": "Andrew Dana Hudson, Ed Finn, Ruth Wylie", "year": 2021, "title": "What can science fiction tell us about the future of artificial intelligence policy?", "venue": "AI & Society 38(1)", "priority": "high", "summary": "Background: AI policy discourse tends to collapse onto a handful of narrative tropes (killer robots, mimic androids, Pinocchio-AI, oracular god-computers) that crowd out the mundane present-day impacts of machine intelligence. Research question: what is the full spectrum of AI narratives in contemporary SF, and which under-explored themes can productively shape near-future AI technology policy? Method: mixed-methods — 13 semi-structured expert interviews (technologists, SF writers, policy thinkers, ~60 min each, Nov 2018–Mar 2019), a May 2019 workshop + public gathering, and three-coder thematic analysis of a short-story corpus to build a taxonomy; the taxonomy then seeded six commissioned SF stories + non-fiction response essays in Slate's Future Tense Fiction series (2019–2020). Data: 96 recent SF short stories (filtered from ~975 award-recognized pieces), plus 13 interview transcripts, a workshop, and the 6 Slate-commissioned works. Findings: AI remains deeply ambiguous in both policy and cultural contexts; surfaces neglected themes such as animal/plant cognition, neurodivergent framings of AI, and the Turing Test as 'ontological end-run'; proposes using SF as speculative anticipatory governance. Limitations: small expert sample, US-centric recent SF, taxonomy not statistically validated, no longitudinal tracking of narrative→policy effects.", "relevance": "Directly supports H1 (Temporal Lead) — frames SF as foreshadowing AI policy debates by years-to-decades; supports H4 (Institutional Uptake) via 'speculative anticipatory governance' linking narrative alignment to policy action. Also engages H3 (Selective Alignment) in that it tracks which AI tropes (killer/mimic/Pinocchio/oracle) dominate public discourse. Method reuse: their three-coder short-story coding scheme + four-category taxonomy (killer, mimic, Pinocchio, oracle) is a ready-made codebook for our Books / Comics corpora; interview+workshop convening is a template for validating the Golden Table. Characters/works to harvest: 96 short stories (worth requesting full list), Future Tense Fiction corpus, Cave & Dihal's four hope/fear dichotomies."}, "JasanoffKim2015": {"key": "JasanoffKim2015", "authors": "Sheila Jasanoff, Sang-Hyun Kim (eds.)", "year": 2015, "title": "Dreamscapes of Modernity: Sociotechnical Imaginaries and the Fabrication of Power", "venue": "University of Chicago Press, ISBN 978-0-226-27645-6", "priority": "high", "summary": "Background: by the early 2010s STS scholars had accumulated rich case studies on technological projects but lacked a unifying mid-range concept; Jasanoff and Kim's 'sociotechnical imaginary' (originally proposed in 2009 for Korea/US nuclear comparison) had begun to gain traction. Research question: what are sociotechnical imaginaries, how do they fabricate power across nations, regimes, and technologies, and what do comparative case studies show about their formation, contestation, and institutional embedding? Method: edited volume with a multi-author conceptual introduction by Jasanoff plus 13 empirical chapters; comparative case method (national/regional + sectoral); theoretical apparatus blends STS, political theory, and history of science. Data: no single dataset — chapters cover US/UK/Germany/India/Korea/China cases on nuclear energy, biotech, agriculture, climate, internet, big science, all foregrounding shared visions of desirable futures and their institutional consequences. Findings: definition refined — 'collectively held, institutionally stabilized, and publicly performed visions of desirable futures, animated by shared understandings of forms of social life and social order attainable through, and supportive of, advances in science and technology'; framework distinguishes imaginaries from expectations, promises, and discourses; cases show imaginaries are co-produced with policy and material infrastructure. Limitations: edited volume (heterogeneous quality), heavy on nuclear/biotech (less on humanoid robotics), pre-LLM, mostly large-state cases.", "relevance": "Foundational reference for H4 (Institutional Uptake) — the 'sociotechnical imaginary' is the canonical STS construct that almost every paper in our literature set (Belsunces, Alacovska, Tutton, Kemiksiz) cites or builds on. Supports H1 (Temporal Lead) by naming the institutional/temporal dynamics of vision-formation. Method reuse: the volume's comparative-case template is directly portable to comparing how the 'humanoid robot' imaginary is institutionalized differently in US (NSF/NIH/USPTO) vs. Japan vs. EU. Character harvest: not focused on individual fictional characters; provides the high-altitude framework that situates them."}, "Jesse2005": {"key": "Jesse2005", "authors": "N. Jesse", "year": 2005, "title": "Autonomous Mobile Robots – From Science Fiction to Reality", "venue": "Studies in Fuzziness and Soft Computing 179 (Springer)", "priority": "high", "summary": "Background: for centuries humans have dreamt of automatons, from Homer's Iliad to Jaquet-Droz's 18th-century writing automaton, Čapek's R.U.R., and Asimov's Three Laws — and these fictional imaginaries frame current expectations of real robotics. Research question: how far has the development of autonomous, intelligent robots progressed, and what technical challenges remain? Method: expository technical review with industry statistics and qualitative comparison of industrial vs. service-robot requirements. Data: no primary dataset — cites UNECE/IFR World Robotics 2002, industry shipment figures (~900,000 industrial robots worldwide in 2002; Japan leads in density; forecast 719,000 service robots by 2005 per OECD), and examples of lawnmower/vacuum/window-cleaning robots, RoboCup challenges, autonomy taxonomies. Findings: autonomy has evolved from 'closed-world' industrial manipulators toward 'open-world' cooperative service robots; hardware has outpaced software; strong autonomy (goal-directed decision-making under uncertainty) remains the bottleneck. Limitations: narrative essay, no new data or analysis, predictions (like soccer-beating humanoids) are speculative; European/German bias.", "relevance": "Supports H1 (Temporal Lead) via the classic 'fiction → engineering' pipeline (Asimov → Engelberger → Unimate; 2001's tablets → real tablets). Provides a baseline for H4 (Institutional Uptake): industrial-robot installed-base time series (2000–2005) can be cross-referenced with NSF/USPTO activity in our golden table. Method reuse: limited — mainly a reference for historical context and a source of autonomy-level distinctions (weak vs. strong autonomy, control/goal autonomy). Characters/works for the corpus: R.U.R., Asimov's robot cycle (and explicit Three Laws text), Jaquet-Droz automaton, 2001: A Space Odyssey, Star Wars, Terminator, I, Robot — all canonical seeds for the Films subcorpus."}, "Kemiksiz2019": {"key": "Kemiksiz2019", "authors": "Asli Kemiksiz", "year": 2019, "title": "Materials of Imagination: On the Limits and the Potentials of the Humanoid Robot", "venue": "NatureCulture vol. 5, pp. 69–95", "priority": "high", "summary": "Background: humanoid robots have famously poor practical utility ('no killer app,' DARPA Robotics Challenge falls), yet humanoid R&D continues at scale in Japan and worldwide — a gap that demands cultural-anthropological explanation. Research question: how do 'materials of imagination' (facts, fictions, beliefs, rationales, aesthetics, norms) co-constitute Japanese humanoid robotics, and how is SF embedded in technoscience and vice versa? Method: 9-month ethnographic fieldwork at a Japanese cognitive-robotics laboratory ('Matsumoto Lab,' pseudonym, Kantō region) plus multi-year tracking of Japanese and international robotics events; theoretical apparatus = Donna Haraway's 'string figures' (SF = science fiction + speculative fabulation + speculative feminism + science fact + science fantasy); Jasanoff-Kim 'sociotechnical imaginaries.' Data: fieldnotes from Matsumoto Lab + interviews with PI Hideaki Matsumoto and lab members + observations of public talks and robotics conferences; documentary analysis of Japanese popular-science books (e.g., Hajimete no robottokōgaku, 2007) and roboticist memoirs (Junichi Takeno 2013); references to Honda ASIMO program shutdown (2018), Rethink Robotics' Baxter and Sawyer shutdown (2018), Pepper, NAO. Findings: humanoid robot is a 'string figure' game where SF tropes (Three Laws, Frankenstein Complex, companion robot) and engineering practice mutually reshape each other; the humanoid form is justified mainly by SF imaginaries and Japanese demographic ('aging society') narratives, not by demonstrated utility. Limitations: single-lab ethnography, Japan-only, qualitative, 2019 vintage (predates current LLM humanoid wave).", "relevance": "Cornerstone reference for H3 (Selective Alignment) — explicitly demonstrates how SF tropes become 'materials of imagination' embedded in laboratory practice — exactly the migration pattern H3 predicts. Strongly supports H1 (Temporal Lead): Asimov's Three Laws (1942) precede their continued invocation in 2019 lab discussions. Supports H2 (Media Sequencing): the Japanese case foregrounds manga/anime as a layer feeding humanoid imaginaries (Astro Boy → ASIMO). Method reuse: ethnographic 'string figures' coding can identify which specific fictional tropes are invoked in lab-internal discourse; the 'aging society' narrative is the explicit policy frame linking SF imaginaries to government funding. Character harvest: Asimov's Three-Laws robots, Frankenstein's creature, Astro Boy, ASIMO, NAO, Pepper, Baxter, Sawyer, R. Giskard Reventlov."}, "KrizEtAl2010": {"key": "KrizEtAl2010", "authors": "Sarah Kriz, Toni D. Ferro, Pallavi Damera, John R. Porter III", "year": 2010, "title": "Fictional Robots as a Data Source in HRI Research: Exploring the Link between Science Fiction and Interactional Expectations", "venue": "IEEE RO-MAN 2010 (19th Int. Symp. on Robot and Human Interactive Communication)", "priority": "high", "summary": "Background: audience-design theory assumes prior interaction with an interlocutor-class, but most Americans have never interacted with a real robot, so their expectations must come from culture — especially SF films. Research question: do the cognitive and social capabilities depicted in popular American SF films align with people's actual interactional expectations of real robots? Method: two-step mixed-method — (1) IMDb-based content analysis of 12 feature-length live-action US SF films, coded by 2 authors each for 7 cognitive and 8 social capabilities with inter-rater agreement ≥60–75% per category; (2) expectations survey of undergraduates matched against film-coded capability rates. Data: 302 IMDb 'robot'-tagged films → 167 → 68 → 50 → top-15 via a 246-respondent familiarity survey → final 12 films after collapsing sequels: Star Wars (1977), Alien (1979), Blade Runner (1982), Terminator (1984), Short Circuit (1986), RoboCop (1987), Star Trek: First Contact (1996), The Matrix (1999), A.I. (2001), I Robot (2004), Stepford Wives (2004), Transformers (2007); coded 25 robot characters. Findings: 100% of fictional robots exhibit vision, spatial cognition, and language; social capabilities (prosocial behavior, close relationships, conformity, stereotyping) are rare; students' expectations follow the same cognitive-heavy/social-sparse pattern, suggesting fictional films really do set interactional expectations. Limitations: only 12 films, only US live-action, low inter-rater agreement on learning/problem-solving (≤68%), student sample, no longitudinal effect measurement.", "relevance": "Strongly supports H3 (Selective Alignment): empirically shows cognition tropes (vision, language) migrate to user expectations far more than social tropes — exactly the asymmetric pattern H3 predicts, but in the opposite direction (social tropes should migrate more for caregiving). Supports H2 indirectly: the IMDb-based sampling frame (302 films → 12) is a direct template for our own IMDb sci-fi film subsample. Method reuse (high): the 15-item capability codebook (7 cognitive + 8 social) and the two-coder reliability protocol can be ported directly; the 'remember well' familiarity scale (5-point) is a cleaner audience-salience filter than IMDb rating alone. Characters to import: C-3PO, R2D2, Darth Vader, Ash, Rachel, Roy (Blade Runner), the Terminator, Number 5 (Short Circuit), RoboCop/Murphy, Data, the Borg (+queen), Neo, Trinity, Morpheus, Cypher, Agent Smith, David, Teddy, Joe (A.I.), Sonny, Mike (I, Robot), Bumblebee, Frenzy, Optimus Prime, Megatron."}, "LorencikEtAl2013": {"key": "LorencikEtAl2013", "authors": "D. Lorenčík, M. Tarhaničová, P. Sinčák", "year": 2013, "title": "Influence of Sci-Fi Films on Artificial Intelligence and Vice-Versa", "venue": "IEEE SAMI 2013 (11th Int. Symp. on Applied Machine Intelligence and Informatics), Herl'any, Slovakia", "priority": "high", "summary": "Background: the authors argue SF and AI/robotics are mutually generative — fictional inventions inspire researchers, who in turn inspire new fiction (citing Verne, Clarke, Heinlein, Asimov). Research question: which AI/robotics concepts from canonical SF films have already been realized, and what do they imply about the future direction of research? Method: qualitative film-by-film analysis, organizing the corpus into three AI-architecture types (collective intelligence, teleoperation, full-embodied intelligence) and mapping each to current technologies (cloud robotics, neural interfaces, prosthetics, UAVs). Data: six purposively chosen films — I, Robot (2004); Terminator; Real Steel (2011); Surrogates (2009); The Matrix (1999); A.I. Artificial Intelligence (2001) — plus references to 2001: A Space Odyssey, Star Trek, Jules Verne. Findings: full-embodied intelligence (A.I.), teleoperation (Real Steel / Surrogates / Matrix), and collective intelligence (I, Robot / Terminator) correspond to extant or emerging technologies (RoboEarth, DAvinCi, DARPA prosthetics, Google Glass, UAVs); concludes SF's primary contribution is inspiration and talent pipeline. Limitations: tiny, non-random film sample; no coding scheme or inter-rater reliability; no quantitative alignment measure; 2013 tech baseline now dated.", "relevance": "Supports H1 (Temporal Lead): gives specific film→technology links (Star Trek communicator → mobile phone; 2001 tablet → iPad; Surrogates → prosthetics). Supports H3 (Selective Alignment): classifying AI into embodied/teleoperated/collective maps onto our 'embodiment × social role × affect' dimensions — useful as an a priori taxonomy for the Films corpus. Method reuse: the three-category AI-architecture taxonomy is a candidate label set for unsupervised cluster validation in the Golden Table; the idea of pairing each fictional technology with a current counterpart suggests an alignment-scoring column. Characters to harvest: V.I.K.I., Sonny (I, Robot), Skynet and Terminators, David (A.I.), Neo/Trinity/Morpheus/Agent Smith (Matrix), the Surrogates, Atom and other Real Steel bots."}, "MeineckeVoss2018": {"key": "MeineckeVoss2018", "authors": "Lisa Meinecke, Laura Voss", "year": 2018, "title": "I Robot, You Unemployed: Robotics in Science Fiction and Media Discourse", "venue": "edited volume chapter (open-access, published 2018)", "priority": "high", "summary": "Background: SF and robotics have been intertwined since Čapek's R.U.R. (1920); even Asimov wrote the introduction to the 1985 Handbook of Industrial Robotics. Research question: how does SF influence real-life robotics research and the news-media discourse about robots (and vice versa)? Method: critical discourse analysis of media coverage + qualitative/interview fieldwork with roboticists (drawn from Voss's PhD project) + close reading of canonical SF films. Data: no quantitative corpus — uses news headlines, press photographs of robots (e.g., Pepper as default stock image for articles on automation unemployment), and informal interviews with working roboticists. Findings: SF functions as a 'hidden curriculum' for roboticists; the 'humanoid embodied robot bias' dominates media illustration even for non-embodied AI; the European Parliament's 2017 resolution on Civil Law Rules on Robotics explicitly cites Asimov's Three Laws as a possible policy model, showing direct fiction→policy migration. Limitations: qualitative/essayistic, no sampling frame, small interview base, Western/European focus, no quantitative alignment measure.", "relevance": "Strongly supports H2 (Media Sequencing): the paper traces how narrative tropes circulate film → news → policy, with comics/animation (Big Hero 6's Baymax) acting as an intermediate stabilizer. Strongly supports H4 (Institutional Uptake): direct fiction→policy citation in European Parliament 2017 resolution. Method reuse: the 'hidden curriculum' framing suggests we track which specific fictional characters are named in our Golden Table's grant/patent abstracts. Characters/works to harvest — extensive: Maria/robot-Maria (Metropolis), Stepford Wives, Blade Runner Replicants, Asimov's positronic robots, Terminator, RoboCop, Johnny 5, Lt. Data, Ex Machina's Ava, Her's Samantha, Big Hero 6's Baymax, Robot & Frank's robot, Pepper, ASIMO."}, "Milburn2010": {"key": "Milburn2010", "authors": "Colin Milburn", "year": 2010, "title": "Modifiable Futures: Science Fiction at the Bench", "venue": "Isis 101(3), 560–569 (Focus section)", "priority": "high", "summary": "Background: literary studies of science have engaged 'literary technologies' and metaphor (Shapin, Latour), but the role of SF in actual lab practice has been obscured by the assumption that science and fiction are categorically separate domains. Research question: how do scientists actually appropriate, remix, and modify SF in their bench work, and what theoretical lens (fan practice, modification, appropriation) better captures the fiction-engineering exchange than the linear 'SF predicts science' folk model? Method: history-of-science essay using close-reading + textual archaeology (tracing specific motifs from SF stories into scientific papers and patents); draws on Hugo Gernsback, Darko Suvin's cognitive estrangement, Le Guin on SF metaphor. Data: no formal corpus — case studies include Leo Szilard's nuclear chain reaction (after H.G. Wells's The World Set Free, 1914), Wernher von Braun's Verne-inspired rocketry, Gerald Feinberg's tachyon paper after James Blish's 'Bleep' (1954), Richard Feynman's 1959 'Plenty of Room at the Bottom' nanotech lecture echoing Heinlein's 'Waldo' (1942) and Hamilton's 'The Cosmic Pantograph' (1935), plus Mark Pesce on VRML and Eric Drexler's nanotechnology project. Findings: scientists' relationship to SF should be understood as 'fan practice' — appropriation, remixing, modification — even when scientists are not self-identified fans; the language of 'influence' and 'infection' in scientist autobiographies betrays a vitalistic anxiety that masks routine fiction→bench traffic. Limitations: essay-form, no quantitative method, anglophone STS canon, illustrative cases.", "relevance": "Cornerstone reference for H1 (Temporal Lead): provides the cleanest history-of-science framing for fiction-precedes-engineering, with concrete documented pathways (Wells→Szilard, Heinlein→Feynman→nanotech). Supports H4 (Institutional Uptake) via the 'fan practice' framing — extends to grant/patent rhetoric. Method reuse: the 'appropriation, remixing, modification' typology is a candidate coding scheme for how fictional concepts appear in NSF/USPTO documents (verbatim citation? metaphor? trope-name?). Character harvest: H.G. Wells's atomic bombs, Heinlein's Waldo, Hamilton's Cosmic Pantograph, Blish's Bleep — these are the primary-source SF works to seed the Books layer when targeting science-citation traffic."}, "MubinEtAl2019": {"key": "MubinEtAl2019", "authors": "Omar Mubin, Kewal Wadibhasme, Philipp Jordan, Mohammad Obaid", "year": 2019, "title": "Reflecting on the Presence of Science Fiction Robots in Computing Literature", "venue": "ACM Transactions on Human-Robot Interaction 8(1), Article 5", "priority": "high", "summary": "Background: SF film/TV is widely assumed to inspire HRI research, but the actual frequency and nature of SF-robot citations inside computer-science publications had never been measured. Research question: how often, in what contexts, and with what utopian/dystopian valence are popular SF robots cited in the ACM Digital Library, and what does this tell us about how computing scholars use SF? Method: full-text keyword search of the ACM Digital Library for 21 named SF robots (12 from CMU's Robot Hall of Fame + 10 IMDb top-rated, minus 1 duplicate), case-insensitive, then qualitative content-coding of every retrieved mention along seven coding categories (paper type, robot attribute, purpose, utopian/neutral/dystopian valence, etc.). Data: 121 relevant mentions across 102 ACM publications spanning 1973–2017; final analyzed sample of 18 robots after exclusions (e.g., 'Data', 'Maria' returned >100k hits and were dropped); HRI Hall of Fame robots: Astro Boy, C-3PO, Data, David (A.I.), Gort, HAL 9000, Huey/Dewey/Louie, Maria, R2-D2, Robbie, T-800, Wall-E; IMDb-top: Smith (Matrix), Oracle, TARS, JARVIS, Terminator, Sentinel, Skynet, Gerty, Baymax, Ava. Findings: voice/dialogue is the most-cited robot attribute; philosophical papers cite SF robots more than technical/theoretical papers; the dystopian dimension is under-utilized — most mentions are neutral or utopian; mentions are concentrated in HRI/HCI venues. Limitations: ACM-only (excludes IEEE/Springer/Elsevier), English-only, named-robot only (misses generic SF imagery), 'Data' and 'Maria' dropped due to false-positives, no temporal trend analysis.", "relevance": "Cornerstone reference for H4 (Institutional Uptake) — the 121-mention dataset directly demonstrates how fictional robots migrate into the academic record, and the 1973–2017 timeline supports lead-lag analysis. Supports H1: shows researchers explicitly invoke SF as inspiration. Supports H3: voice/dialogue is the migrating attribute. Method reuse (very high): full-text keyword search + qualitative coding pipeline can be ported to PatentsView (USPTO Y10S901) and NSF/NIH abstracts to count humanoid-robot trope mentions in grants/patents; the 18-robot character set is a ready stimulus for our embedding pipeline. Character harvest: full 18-robot set (CMU Hall of Fame + IMDb top), most aligning with characters already in OsawaEtAl2022 / SaffariEtAl2021."}, "Ndalianis2013": {"key": "Ndalianis2013", "authors": "Angela Ndalianis", "year": 2013, "title": "Astro Boy, Science-fictionality and Japanese Robotics", "venue": "Deletion: The Open Access Online Forum in Science Fiction Studies, Episode 1: The Pleasures of Science Fiction (Aug 30, 2013)", "priority": "high", "summary": "Background: since the 1990s the 'science-fictionality' (Csicsery-Ronay) of robots has migrated off the screen into Japanese commercial entertainment, producing real humanoid robots (Aibo, QRIO, Kirobo) explicitly designed after fictional ones (C-3PO, Astro Boy). Research question: how does the journey of 'science-fictionality' between SF as genre and the real-world Japanese robotics industry actually unfold — who builds what, inspired by which fictional characters, and what does this mutual traffic mean for our understanding of science fiction as a cultural mode? Method: cultural-studies essay drawing on Brooks Landon's 'science fiction thinking' (2002) and Istvan Csicsery-Ronay's 'science-fictionality' (2002, 2008); historical/biographical case-study method tracing real engineers' SF-fan biographies and their robot products. Data: no formal dataset — biographical case studies of Sony's Tatsuzo Ishida (commissioned humanoid entertainment robots after C-3PO), Sony engineers Yoshihiro Kuroki and Shingo Tamura (Waseda University Robotics Lab), Tomotaka Takahashi (Kyoto University Robo-Garage, self-professed Astro Boy fan, creator of Kirobo/Mirata/Robi/Evolta/Chroino/Manoi/Neon — all 'boy robots' inspired by Astro Boy); plus Kirobo's August 4, 2013 launch to ISS (first robot-astronaut companion). Findings: Japanese robotics is profoundly SF-inflected — engineers' choice of humanoid form, naming, dimensions (60cm Astro-Boy-sized), and even the move into space is directly traceable to fictional precursors; QRIO crossed the boundary by starring in a 2004 Astro Boy anime episode. Limitations: short essay, biographical case studies, no quantitative trend analysis, single-country focus.", "relevance": "Cornerstone for H1 (Temporal Lead) and H3 (Selective Alignment): one of the cleanest documented fiction→engineering pathways in our literature set — Astro Boy → Sony QRIO/Aibo/SDR-3X → Kyoto Robo-Garage's Kirobo (which actually launched into space). Supports H2 (Media Sequencing): manga (Astro Boy) → film (Star Wars/C-3PO) → anime (Astro Boy 40th anniv.) → real robot (QRIO) — exactly the comics-as-bridge pattern H2 predicts. Character harvest (high-yield): Astro Boy / Tetsuwan Atom; Sony Aibo (real); SDR-3X / SDR-4X (real Sony Dream Robots); QRIO (real); Tomotaka Takahashi's Kirobo + Mirata + Robi + Evolta + Chroino + Manoi + Neon (real); plus fictional inspirations Magdan, Tetsujin 28GO, Gabby, Tachikoma (Ghost in the Shell); C-3PO (Star Wars)."}, "Nishimura2025": {"key": "Nishimura2025", "authors": "Keiko Nishimura", "year": 2025, "title": "Representations of emotional capacity in human-robot interaction: From Astro Boy to Pepper", "venue": "The Future of Humans and Emotional Machines: Narratives from Japanese Culture in the 21st Century (ed. Elena Giannoulis), Routledge — Chapter 2", "priority": "high", "summary": "Background: Japanese commercial communication robots like Softbank's Pepper (2014, production halted 2020) and Groove X's LOVOT (2018/2019) are designed to 'stay close to people' through emotional capability, but their emotional credibility derives from a long lineage of Japanese popular cultural narratives. Research question: how do Japanese popular narratives shape the public's reception of commercial sociable robots that exhibit emotional capacity, and through what specific tropes does a mechanical robot fulfil human emotional needs? Method: cultural-studies/literary analysis combined with 13 months of ethnographic fieldwork (2017–2018) on Pepper handlers; close readings of two early-2010s narratives chosen against an explicit 8-criterion 'reasonably realistic' filter that mirrors Pepper's actual deployment context. Data: two primary works — Yasuhiro Yoshiura's anime film Time of Eve (2010, Studio Rikka) and Uko Nishi's manga Tonari no robotto (My Neighbor Robot, 2014, Akita Shoten); contextual sample of 250+ Japanese robot-themed anime/manga (170+ featuring autonomous robots) from Tezuka onward; ethnographic fieldnotes on Pepper handlers; plus framing references to Lucy Suchman, Richard Doyle's 'vitality effect.' Findings: Japanese popular culture's 'Type B' robots (caring, social, named, helper-friend — descended from Tezuka's Astro Boy) contrast with mass-produced 'Type A' robots; the narrative trope of a robot fulfilling emotional needs by stressing its mechanical origins and not fulfilling practical needs is what makes contemporary Pepper 'work' as a sociable robot. Limitations: two-text close reading + ethnography; Japan-only; qualitative.", "relevance": "Cornerstone reference for H2 (Media Sequencing) and H3 (Selective Alignment) on the affective dimension — directly demonstrates how affective robot tropes flow from manga (Astro Boy) → anime (Time of Eve) → manga (Tonari no robotto) → commercial product (Pepper, LOVOT). Strongly complements Ndalianis2013, Kemiksiz2019 on the Japanese fiction→robotics pipeline. Method reuse (high): Nishimura's 8-criterion filter for selecting 'reasonably realistic' SF works is a directly portable inclusion-criterion template for our Books/Comics layer; the Type A vs. Type B taxonomy is an additional candidate cluster label. Character harvest: Astro Boy / Tetsuwan Atom, Tex (Time of Eve), Masaki (his human partner), 250+ anime/manga robots, Pepper (real), LOVOT (real), Gakutensoku (Japan's First Robot, 1928)."}, "OsawaEtAl2022": {"key": "OsawaEtAl2022", "authors": "Hirotaka Osawa, Dohjin Miyamoto, Satoshi Hase, Reina Saijo, Kentaro Fukuchi, Yoichiro Miyake", "year": 2022, "title": "Visions of Artificial Intelligence and Robots in Science Fiction: a computational analysis", "venue": "International Journal of Social Robotics 14", "priority": "high", "summary": "Background: SF has long functioned as society's testbed for AI/robot imaginaries, but most prior analyses are anecdotal and restricted to English-language film. Research question: what are the principal dimensions along which fictional AI/robots vary, and can these be recovered computationally from an expert-curated corpus? Method: 7 Japanese SF experts (6 critics + 1 writer) nominated AI systems along diversity / impact / uniqueness criteria; each system was coded on 9 characteristic elements (intelligence, humanity, physicality, existence, purpose, etc.); dimensionality reduction via PCA, followed by Ward's hierarchical clustering. Data: 115 AI systems from SF works — 93 novels, 12 comics, 7 movies (2 animations), 3 plays; mean publication year 1981 (SD 26.8); 14 pre-1945, 64 post-WWII pre-1995, 37 post-internet (1995+); covers Japanese and Western canon. Findings: two principal components — intelligence axis and humanity axis — explain most variance; four clusters emerge (Human-like, Intelligent Machines, Buddies/Helpers/Vehicles, Infrastructure); post-internet era shifts the distribution toward 'intelligent infrastructure'. Limitations: expert-selection bias, Japan-centric curators, 9 hand-coded elements may miss latent dimensions, no external validation of clusters against HRI real-world data.", "relevance": "Cornerstone reference — supports all four hypotheses. H1 (Temporal Lead): dated corpus (1945+) with timeline data enables direct lead-lag analysis against grant/patent peaks. H2 (Media Sequencing): media-type breakdown (93 novels / 12 comics / 7 films / 3 plays) lets us test whether comics sit between novels and films chronologically. H3 (Selective Alignment): four-cluster taxonomy (Human-like / Machine / Buddy / Infrastructure) provides pre-defined tropes to test for selective migration into grants. H4 (Institutional Uptake): post-1995 'infrastructure' shift aligns with the internet-era — directly testable against NSF program-code 1444 launches. Method reuse (very high): PCA + Ward clustering + 9-element coding scheme is the most direct method template for our Golden Table. Characters: 115 fully-coded AI entities (ideal seed corpus for embedding validation) including Frankenstein's monster, Rossum's robots, HAL, Data, Multivac, Skynet, Wintermute (Neuromancer), Dragon's Egg entities, Solaris ocean, Crowbot Jenny, and many Japanese-canon entries rarely catalogued in English research."}, "Richardson2015": {"key": "Richardson2015", "authors": "Kathleen Richardson", "year": 2015, "title": "An Anthropology of Robots and AI: Annihilation Anxiety and Machines", "venue": "Routledge Studies in Anthropology vol. 20 (Taylor & Francis), ISBN 978-1-138-83174-2", "priority": "high", "summary": "Background: roboticists at MIT operate inside a Hollywood-saturated culture where Terminator-style 'annihilation anxiety' shapes both research questions and self-understanding; anthropology has not yet provided a sustained ethnography of how SF co-constructs lab practice. Research question: how do cultural ideas — especially SF fictions of robot revolt and companionship — co-construct the technological practices of MIT roboticists, and how has the figure of the robot shifted from the 1920s 'worker' to the 2000s 'social' robot? Method: long-term ethnographic fieldwork at MIT robotics labs (Brooks's Humanoid Robotics Group / CSAIL), participant observation, interviews with roboticists, document/film analysis; six thematic chapters — Revolutionary Robots, Out of Body Minds, Social Robots, The Gender of the Geek, The Dissociated Robot, Fantasy and Robots. Data: ethnographic fieldnotes from MIT (Stata Center, Brooks lab and others) including interviews with Rodney Brooks, Una-May O'Reilly, Cynthia Breazeal-era social-robot makers, Lijin Aryananda, Aaron Edsinger, Charlie Kemp; close readings of Terminator series, R.U.R., Frankenstein. Findings: 'annihilation anxiety' (R.U.R. → Terminator) is the master cultural frame Western roboticists work within; even as the ostensibly social/companion robot rises (post-2000), the destruction-narrative persists as the dominant Euro-American imaginary; gender norms ('the geek') and dissociation tropes shape lab practice. Limitations: single-site (MIT), short-fieldwork ethnography, Anglo-American focus, qualitative, no quantitative content analysis.", "relevance": "Cornerstone reference for H1 (Temporal Lead) and H3 (Selective Alignment) — Richardson's MIT lab ethnography is the most direct empirical demonstration of fictional-robot tropes operating inside an actual robotics laboratory and shaping research priorities. Strongly supports H4 (Institutional Uptake) — links cultural narrative to research-agenda setting. Method reuse: the fiction-as-cultural-frame approach is a model for our patent/grant text analysis; the chapter scheme (revolutionary / out-of-body / social / gendered / dissociated / fantasy) is a candidate sub-typology for humanoid tropes. Character harvest: full Terminator universe, R.U.R., Frankenstein, plus real MIT robots: Cog, Kismet, Domo, Mertz, Leonardo, Nexi (Breazeal-era social robots); R2-D2, Wall-E referenced."}, "RussellYarosh2018": {"key": "RussellYarosh2018", "authors": "Daniel Russell, Svetlana Yarosh", "year": 2018, "title": "Can We Look to Science Fiction for Innovation in HCI?", "venue": "ACM Interactions XXV(2)", "priority": "high", "summary": "Background: designers and technologists routinely invoke SF (Star Trek, Minority Report, Blade Runner) as inspiration, and the term 'design fiction' (Sterling & Bleecker 2009) has formalized this practice. Research question: is SF actually a reliable source of future-technology predictions and innovation for HCI, or does it mislead designers? Method: opinion/commentary — not an empirical study; synthesizes historical prediction accuracy, authorial-context bias, and trope critique into five heuristics for writers of design fictions. Data: illustrative cases only — Heinlein's 19 1949 predictions (only 3 correct); a 95-prediction AI timeline review (1950–2012); Mary Meeker's 5-year internet forecast off by 2×; Qualcomm Tricorder XPRIZE as emulation case; Mullins 2012 retrospective finding >10-year forecasts barely better than coin flips. Findings: SF is good for idea generation but poor for timing/plausibility; its visions are anchored to the author's time, dominated by white-male authorship, and cluttered with tropes (walk-up-and-use UIs, antigravity, humanoid robots) that should not be imported uncritically. Limitations: commentary, not research; no systematic corpus; US/English SF-only.", "relevance": "Supports H1 (Temporal Lead) conditionally — argues SF leads but unreliably, important caveat for our lead-lag analysis. Supports H3 (Selective Alignment) by explicitly listing 'humanoid robots' as a trope that migrates into design without critical evaluation. Method reuse: the five heuristics for design fiction (5–10 year horizon, author context, trope scrutiny, plausibility, downside imagination) can serve as validation criteria for which fiction-originated concepts actually diffuse into grants/patents. Also points toward 'design fiction' (Sterling/Bleecker/Kirby's diegetic prototype) as a distinct genre worth coding separately. Characters to harvest: Star Trek tricorder & holodeck, Minority Report gestural UI, Iron Man HUD, Star Wars droids (R2-D2, C-3PO), HAL 9000, Blade Runner Replicants."}, "SaffariEtAl2021": {"key": "SaffariEtAl2021", "authors": "Ehsan Saffari, Seyed Ramezan Hosseini, Alireza Taheri, Ali Meghdari", "year": 2021, "title": "'Does cinema form the future of robotics?': a survey on fictional robots in sci-fi movies", "venue": "SN Applied Sciences 3 (Springer Nature)", "priority": "high", "summary": "Background: sci-fi movies both reflect and shape public attitudes toward real robots, yet large-scale surveys of how fictional robots (FRs) are designed across cinema history are rare. Research question: how are fictional robots in popular sci-fi cinema designed along appearance, interaction, and ethical/social dimensions, and what does that imply for real-world robotics? Method: systematic review with IMDb-based sampling, three-dimensional coding scheme (appearance design, interactive design including AI, ethical/social design), plus a full-row data table (Table 1) of every FR with its movie and year. Data: 134 sci-fi films containing FRs with IMDb score > 5, yielding 108 unique Fictional Robots; ~34% of the sampled films are from the last 5 years (post-2015), <6% are pre-1980 — skewed toward recent cinema; Table 1 lists each robot with film and release year. Findings: appearance ranges from humanoid to insectoid to non-anthropomorphic; AI design ranges from scripted to self-aware; ethical/social design reveals a growing emphasis on companionship and affective relationships; trend lines show shift from 'evil rebellious robot' to 'companion robot' post-2010. Limitations: IMDb-only sampling, English-language cinema bias, score > 5 cutoff, no inter-coder reliability reported, no connection to real-robot patents.", "relevance": "Strongly supports H2 (Media Sequencing) and H3 (Selective Alignment): 108-robot catalog with year, appearance, AI, and ethics tags is a ready-made seed for the Films layer of the Golden Table. H1: Table 1's film-by-year timeline directly enables lead-lag analysis against NSF robotics grants and USPTO CPC Y10S901 patents. Method reuse: the three-dimensional coding (appearance / interactive / ethical-social) is complementary to Osawa's 9-element scheme and to Jacobs's agency-experience axes — we can compose a unified 4–6 dimension codebook. Character harvest: all 108 FRs including R2-D2, C-3PO, BB-8, HAL 9000, T-1000, Chappie, TARS, Wall-E, Baymax, Ava, Maria, David/Teddy, Sonny, Johnny 5, Bumblebee, Optimus Prime, Number Johnny 5, Atom (Real Steel), Robby the Robot, Gort, the Terminators, Ash, Bishop, Data, R. Daneel Olivaw — use the full Table 1 as the canonical Films-character list."}, "SavelaEtAl2021": {"key": "SavelaEtAl2021", "authors": "Nina Savela, Tuuli Turja, Rita Latikka, Atte Oksanen", "year": 2021, "title": "Media effects on the perceptions of robots", "venue": "Human Behavior and Emerging Technologies (Wiley)", "priority": "high", "summary": "Background: media-persuasion theories (cultivation, mere-exposure, ELM, HSM, narrative transportation, cognitive dissonance) predict that repeated exposure to robot imagery shapes attitudes and trust, but empirical evidence spanning both fiction and fact channels is scarce. Research question: are positive attitude and trust toward robots stronger among people with more extensive media exposure, and does this vary by fiction vs. fact-based channels? Method: three sequential studies — Study 1 survey of Finnish care workers; Study 2 two nationally-representative US surveys; Study 3 online trust-game experiment with a behavioral outcome measure; regression models with media-exposure indices, attitude, and trust as outcomes. Data: Study 1 N = 3,800 Finnish care workers via 2 nurse trade unions (2016; 95% female; M_age = 46.5); Study 2 Sample 1 N = 1,003; Sample 2 N = 969 US adults via MTurk (2019); Study 3 trust-game experiment n = 331 (2019, MTurk); subsample analysis (n = 544) on care-robot safety. Findings: overall media exposure to robots is associated with more positive general attitudes, but only fact-based (news/documentary) exposure predicts trust; fiction exposure alone boosts attitude but not trust — consistent with dual-process theories. Limitations: cross-sectional except Study 3; MTurk sampling bias; self-report of media exposure; Finland-US only; no longitudinal cultivation tracking.", "relevance": "Supports H4 (Institutional Uptake) with the strongest causal evidence in the literature: fact-based media exposure → trust → adoption pathway. Supports H3 (Selective Alignment) by showing which dimensions of robot perception (attitude vs. trust) migrate from which channels (fiction vs. fact). Method reuse: the media-exposure scale (frequency × channel) can be adapted for measuring public discourse saturation in our Golden Table; three-study design is a template for validating fiction→grant alignment effects. Characters referenced (cited only): C-3PO, R2-D2, WALL-E, Robot & Frank's robot — useful benchmarks for surveys in later project stages."}, "SchaeferEtAl2015": {"key": "SchaeferEtAl2015", "authors": "Kristin E. Schaefer, Jeffrey K. Adams, Jacquelyn G. Cook, Angela Bardwell-Owens, Peter A. Hancock", "year": 2015, "title": "The Future of Robotic Design: Trends From the History of Media Representations", "venue": "Ergonomics in Design 23(1), Jan 2015 (Sage / HFES feature)", "priority": "high", "summary": "Background: real-world robot design has long been shaped by fictional-media representations, but designers tend to rely on intuitions rather than systematic media-trend analysis. Research question: how have fictional-media depictions of robots (in film, books, TV) shaped public perceptions and real-world robot design, and wh
