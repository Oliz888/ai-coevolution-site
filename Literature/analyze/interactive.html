at design directions can be inferred for the next generation? Method: historical/qualitative review combining a timeline of key real-robot milestones (Archytas's Pigeon 3rd c. BCE through Honda's 1986 humanoid program) with a parallel timeline of canonical fictional robots (Maria/Metropolis 1927 → contemporary surrogates), organized along three design themes (anthropomorphism, form-function match, human-robot integration). Data: dual-timeline historical sample — real-robot milestones drawn from secondary sources (Tesla 1898 boat, Devol 1961 Unimate, Stanford Cart 1970/1979, McCarthy & Minsky AI Lab 1959, Shakey 1966, Honda 1986); fictional sample drawn from canonical SF films (Metropolis 1927, Robby 1956, Mechagodzilla 1974, Gort 1951, etc.); plus a 'Robotic Mental Models' construct. Findings: deanthropomorphizing trend mid-1930s–early-1950s (boxy faceless robots like Gort) shifts toward fully expressive humanoid surrogates as facial features (eyes, eyebrows) become essential for social interaction; form-function-mismatch lessons; Japanese influence creates an animalistic-robot subgenre (Mechagodzilla 1974). Limitations: short feature article, no quantitative coding or inter-rater reliability, US/Hollywood bias, no audience-effect data.", "relevance": "Strongly supports H1 (Temporal Lead) — concrete bidirectional timeline of fiction-and-engineering, providing one of the cleanest visualizations of fiction→design diffusion. Strongly supports H3 (Selective Alignment) — the three design themes (anthropomorphism, form-function, integration) are the exact 'humanoidness dimensions' our project seeks to track. Method reuse: the dual-timeline design (real milestones × fictional milestones) is directly portable as a Golden Table format; the trend bins (mechanical-shape / boxy-villain / animalistic / surrogate-human) are candidate cluster labels. Character harvest: Maria (Metropolis 1927), Robby the Robot (Forbidden Planet 1956), Gort (Day the Earth Stood Still 1951), Mechagodzilla (1974), boxy 1960s villain robots, contemporary surrogate humans like Ava (Ex Machina) and Sonny (I, Robot)."}, "SermanetEtAl2025": {"key": "SermanetEtAl2025", "authors": "Pierre Sermanet, Anirudha Majumdar, Vikas Sindhwani", "year": 2025, "title": "SciFi-Benchmark: Leveraging Science Fiction To Improve Robot Behavior", "venue": "arXiv preprint 2503.10706v2 (Google DeepMind / Princeton University)", "priority": "high", "summary": "Background: as LLM-controlled robots are deployed in the real world, evaluating their semantic safety and ethical alignment at scale is urgent — and SF literature is a vast, pre-existing repository of high-stakes ethical scenarios involving AI agents. Research question: can the corpus of SF literature serve as a scalable benchmark for measuring (and improving) the alignment of LLM-controlled robots with human values, and can SF-derived 'constitutions' improve real-world behavior? Method: LLM-introspection pipeline — for 824 major SF works (movies, TV, novels, plus 95 scientific books), extract key decision points, generate question/answer pairs and good/bad alternative actions, collect human preference votes, then auto-amend and auto-merge SF-inspired 'constitutions' that prompt-condition Gemini and other LLMs; cross-validate on the real-world ASIMOV Benchmark (hospital-injury reports, real-world images). Data: SciFi-Benchmark — 824 SF sources (Table 11), 9,056 questions, 53,384 answers (LLM-generated), plus 264 human-labeled answers across 51 questions; data at scifi-benchmark.github.io. Findings: SF AIs are poorly aligned with human values (21.2%), but modern LLMs + SF-derived constitutions reach 95.8% alignment; SF-derived constitutions also rank near-top on the real-world ASIMOV benchmark (51.3% → 91.9% under adversarial prompts); released as the first large-scale robot-ethics benchmark. Limitations: relies on LLM recollection (training-data bias), 'good/bad' polarities subjective, English-only canon, no longitudinal alignment tracking, ethics-of-fiction is itself contested.", "relevance": "Cornerstone for H1 (Temporal Lead) and H4 (Institutional Uptake) — the 824-work SF→benchmark→real-world pipeline is the most explicit fiction-to-engineering migration documented to date, and it directly motivates our project's premise. Method reuse (very high): the LLM-introspection key-decision-extraction pipeline is exactly the method we should adopt for embedding fictional plot-points into the Golden Table; the 824-work source list (Table 11) is a ready-made superset for our Books + Films corpus. Characters to harvest: WALL-E, the Terminator/Skynet, HAL 9000, paperclip-maximizer (Bostrom), R.U.R., Real Humans synths, plus the 824-work list itself."}, "Szollosy2017": {"key": "Szollosy2017", "authors": "Michael Szollosy", "year": 2017, "title": "Freud, Frankenstein and our fear of robots: projection in our cultural perception of technology", "venue": "AI & Society 32(3), 433–439 (Open Forum)", "priority": "high", "summary": "Background: robots are persistently presented as monstrous in newspaper headlines, films, and TV — even when actual deployments are mundane (vacuum cleaners, prosthetics) — and this gap between perception and reality has costs for HRI design. Research question: why are we afraid of robots, and what psychoanalytic dynamics (especially Freudian projection) connect contemporary robot monsters to a longer lineage of cultural monsters (Frankenstein, Mr. Hyde, vampires, zombies)? Method: psychoanalytic / post-Freudian cultural analysis; close readings of Terminator, Blade Runner, I, Robot, Star Trek (Borg), R.U.R., Metropolis, plus tabloid headlines about 'Terminator-style' robots and prosthetics; Asimov's 'Frankenstein Complex' as an organizing frame. Data: no formal dataset — illustrative close readings + tabloid sample (UK Daily Mail headlines on Terminator-style robots, Cybermen-style bionic ears, Robot vacuum 'attacking' South Korean housewife; Telegraph; Mirror); psychoanalytic framework from Freud (the uncanny, projection), Asimov, Green's 'dead mother' theory, Frankenstein/Faust mythology. Findings: robot monsters represent projected human anxieties about (a) annihilation and death, (b) individual disintegration into collective identity, (c) the unresponsive 'dead mother,' (d) Oedipal fear of the castrating son — i.e., we are afraid of the monsters within us, displaced onto our creations; these projection dynamics inform how the public actually receives real-world robots. Limitations: psychoanalytic-essay form, anglophone Hollywood canon, no quantitative reception data.", "relevance": "Strongly supports H3 (Selective Alignment): explains which robot tropes (annihilation, hive mind, parricidal monster) migrate into the popular imagination and why — directly informs our trope-classification scheme. Supports H1 (Temporal Lead) by tracing the cultural lineage from 19th-century gothic monsters through R.U.R. (1921) to contemporary Terminator imagery. Method reuse: Szollosy's four-projection-axis taxonomy (annihilation / hive / dead-mother / Oedipal) is a candidate label set for tagging dystopian humanoid representations; the 'Frankenstein Complex' is a portable variable for grant/patent rhetoric mining. Character harvest: Frankenstein's creature, Mr. Hyde, the Borg + Borg Queen (Star Trek), the Terminator T-800/T-1000, Cybermen (Doctor Who), HAL 9000, Roy Batty + Tyrell (Blade Runner), Maria/Maschinenmensch (Metropolis), Sonny (I, Robot), zombies as background category."}, "Wilson2015": {"key": "Wilson2015", "authors": "Daniel H. Wilson", "year": 2015, "title": "Chasing Our Science Fiction Future (HRI'15 keynote)", "venue": "Proceedings of the Tenth Annual ACM/IEEE International Conference on Human-Robot Interaction (HRI'15), p. 245", "priority": "high", "summary": "Background: Wilson — a CMU Robotics PhD turned New York Times bestselling SF author (Robopocalypse, Robogenesis, How to Survive a Robot Uprising) — was invited to keynote HRI'15 on the bidirectional fiction-engineering relationship. Research question: which SF tropes (singularity, killer robots, etc.) actually inspire roboticists, which persist or fade, and how do SF's narrative needs align (or not) with the actual science community? Method: opinion/keynote essay (single-page abstract) drawing on Wilson's dual identity as scientist and SF author. Data: no formal dataset — illustrative cases include Honda's ASIMO humanoid (said to be directly inspired by Tezuka's Astroboy manga) and Wilson's own DreamWorks/Spielberg-attached Robopocalypse adaptation. Findings: SF directly shapes both engineer career choice and public technology expectations; certain archetypes (killer robot, singularity) persist because they serve narrative needs; the 'inextricable link' between SF and engineering helps determine when futures arrive. Limitations: single-page keynote abstract — no method, no data, no quantitative claims; one-author opinion piece; useful primarily as primary-source testimony from a working roboticist+SF author.", "relevance": "Strongly supports H1 (Temporal Lead): Wilson's explicit Asimo→Astroboy attribution is a textbook fiction→engineering datum, and his own Robopocalypse→Spielberg adaptation closes the loop in the other direction (engineering→fiction). Supports H2 (Media Sequencing) by naming the manga (Astroboy) as the bridge between literature and humanoid robotics. Supports H3 (Selective Alignment): explicitly identifies which SF tropes (singularity, killer robots) survive vs. fade — directly testable against our trope-frequency analysis. Method reuse: low (it's a keynote abstract); but as primary testimony from a roboticist-author it is high-priority for citing in our intro/motivation. Character harvest: Astroboy, the Robopocalypse robots, Asimo (real), Wilson's How-to-Survive bots."}, "Worsdorfer2025": {"key": "Worsdorfer2025", "authors": "Manuel Wörsdörfer", "year": 2025, "title": "From HAL to Her: AI Philosophy Through the Lens of Pop Culture", "venue": "SSRN preprint 5999094 (University of Maine, Maine Business School & School of Computing and Information Science)", "priority": "high", "summary": "Background: AI ethics scholarship typically focuses on individual films/texts or abstract debates; few studies adopt a systematic, comparative thematic analysis of AI representations across books, films, and TV with explicit links to computer ethics. Research question: what are the most prominent leitmotifs in AI books, films, and TV; what ethical insights do they offer when read through computer ethics; and how do they relate to dominant real-world AI narratives (hype, competition, dystopian Terminator/Frankenstein)? Method: thematic analysis of a curated cross-section of cultural works structured along motifs (consciousness, emotional intelligence, surveillance, techno-authoritarianism, class conflict, sex/objectification); philosophy-of-technology framework grounded in 'technological realism' (Wörsdörfer's positioning between optimism, pessimism, determinism, somnambulism). Data: extensive curated corpus including The Imitation Game (Tyldum 2014), The Social Network (Fincher 2010), Citizenfour (Poitras 2014), 2001: A Space Odyssey, Blade Runner, Ex Machina, Her, The Matrix, Ready Player One, Westworld, Black Mirror, A.I. Artificial Intelligence, Star Trek (Three Laws), 1984/Brave New World, Metropolis, RealBotix Harmony references, plus theoretical treatments by Searle (Chinese Room), Dreyfus, Nagel, Nida-Rümelin & Weidenfeld, Barron's AI and Popular Culture (2023). Findings: dominant narratives — hype/transcendence, competition, dystopian catastrophe (Terminator/Frankenstein) — are reductive and counterproductive; advocates 'technological realism' as a context-aware, ethically-grounded alternative; identifies video games as an underexplored medium for shaping AI imaginaries. Limitations: thematic-essay form, no quantitative coding, anglophone canon, broad rather than deep coverage of any single work.", "relevance": "Strongly supports H3 (Selective Alignment): explicit thematic taxonomy of AI motifs (consciousness, emotional intelligence, surveillance, techno-authoritarianism, sexualization) that maps directly onto our humanoidness dimensions. Supports H1 (Temporal Lead) by tracing motif evolution from Butler's Erewhon (1872) through Capek to today. Method reuse: Wörsdörfer's motif categories + 'technological realism' axis are candidate trope labels; his cross-medium curated corpus (books + films + TV) is a useful seed list for our Books/Films layer. Character harvest (high-yield): HAL 9000, Roy Batty + Deckard + Voight-Kampff test (Blade Runner), Ava + Kyoko + Caleb + Nathan (Ex Machina), Samantha + Theodore (Her), Neo + Agent Smith (Matrix), Wade Watts (Ready Player One), Westworld hosts, Bicentennial Man, R2-D2 + C-3PO + Lt. Data + Three Laws (Star Trek), 1984's Big Brother, Brave New World, Metropolis Maria, plus Snowden / Zuckerberg / Turing as real-world figures."}, "Bartolotta2024": {"key": "Bartolotta2024", "authors": "Simona Bartolotta", "year": 2024, "title": "Thought Experiments, Literary Fiction, and Science Fiction: The Example of Isaac Asimov's Robot Cycle", "venue": "Poetics Today 45(4)", "priority": "medium", "summary": "Background: debates in literary cognitivism ask whether fiction — especially science fiction — can generate genuine knowledge in the manner of philosophical thought experiments (TEs). Research question: how should we characterize the epistemic function of SF narratives when they neither resolve into a clear argument nor remain purely imaginative? Method: philosophical/literary close reading, drawing on McComb, Gendler, Nersessian, Elgin, Egan, and Sorensen, illustrated through Asimov's Robot cycle and Searle's Chinese Room. Data: no empirical corpus — conceptual engagement with Asimov's novels and short stories (and secondary works like Watts's Blindsight and Lem's The Invincible). Findings: Bartolotta introduces the concept of 'aimless argumentativity' — SF stories repackage information in ways that raise rather than resolve questions about minds, robots, and ethics, making Asimov's cycle a paradigmatic case of non-linear seriality as serial TE. Limitations: single-author/single-cycle focus and purely theoretical; no audience-reception or corpus evidence.", "relevance": "Supports H1 (Temporal Lead) by framing SF as the site where conceptual problems about robot minds are posed before institutional discourse catches up; supports H3 (Selective Alignment) via its emphasis on cognition/ethics tropes (Three Laws, robot mind) that later migrate into HRI. Method reuse: the 'fiction-as-thought-experiment' framing suggests a coding scheme for the golden table — tag Books/Comics/Films by whether they pose (a) ethical conundrum, (b) cognition question, (c) embodiment question, parallel to Osawa's coded elements. Characters/works worth harvesting for the Books subcorpus: Asimov's Robot cycle (I, Robot; Caves of Steel; Naked Sun; Robots of Dawn; Robots and Empire), Watts's Blindsight, Lem's The Invincible and Solaris, Searle's Chinese Room as a TE reference point."}, "DimovGunestepe2024": {"key": "DimovGunestepe2024", "authors": "Dimo Dimov, Kutay Güneştepe", "year": 2024, "title": "Capitalizing the future: opportunity capital as symbolic significance of an entrepreneur's future-venture story", "venue": "Entrepreneurship & Regional Development 36(9-10), 1145–1160", "priority": "medium", "summary": "Background: entrepreneurship research has been silent on a central puzzle — what exactly are investors buying when they fund a not-yet-existent product (e.g., Drew Houston pitching Dropbox in 2007 before any code existed)? Research question: how can a future — something that can only be imagined — attract economic capital, and what is the symbolic exchange between entrepreneur's words and investor's money? Method: theoretical-conceptual paper integrating Daniel Dor's (2015) language-as-instruction-of-imagination model with Bourdieu's theory of practice (field, habitus, capital). Data: no empirical dataset — illustrative cases include Drew Houston/Dropbox 2007 ($15K Y Combinator + $1.25M VC), Marc Andreessen's '2×2 matrix' on consensus/non-consensus venture investing, plus theoretical framework from sociology and linguistics. Findings: introduces 'opportunity capital' as the symbolic counterpart to the investor's economic capital — the entrepreneur's future-venture story has 'weight' on the symbolic side that balances the investor's money on the economic side; futures are capitalized when stories successfully instruct imagination. Limitations: theoretical-conceptual only, no quantitative test, illustrative case sample, not specifically about humanoid robots.", "relevance": "Supports H4 (Institutional Uptake) at a general theoretical level — provides the language/Bourdieu-based framework for why fiction-flavored entrepreneurial stories attract capital, complementing Alacovska2025's 'sci-fi capital' construct (Alacovska 2025 critiques DimovGuneştepe explicitly). Useful as a non-humanoid baseline for measuring how the same mechanism works for less SF-heavy startups. Method reuse: 'opportunity capital' as the symbolic counterpart of economic capital is a candidate measurement construct for grant abstracts (does mentioning a fictional robot increase the symbolic 'weight' of a proposal?). Character harvest: Drew Houston/Dropbox is the running case example, not a fictional character."}, "FunkIrrgang2014": {"key": "FunkIrrgang2014", "authors": "Michael Funk, Bernhard Irrgang (eds.)", "year": 2014, "title": "Robotics in Germany and Japan: Philosophical and Technical Perspectives", "venue": "Peter Lang (Dresden Philosophy of Technology Studies, Vol. 5), ISBN 978-3-631-62071-7", "priority": "medium", "summary": "Background: Germany and Japan are the two leading nations in robotics R&D; the volume gathers cross-national philosophical, ethical, and technical perspectives stemming from a TU Dresden 2010 conference. Research question: what philosophical, cultural, and roboethical frameworks distinguish Japanese and German approaches to humanoid robotics, and how do they intersect with popular culture and music robots? Method: edited volume of 12 chapters across five parts (Philosophical Frameworks, Roboethics, Technology Assessment, Popular Culture & Music Robots, Essays); mix of conceptual essays, case studies, and ethnographic observations. Data: no single dataset — chapters draw on phenomenological-hermeneutical analyses (Coeckelbergh, Funk), Japanese popular-culture surveys (Maika Nakao, 'Robots in Japanese Popular Culture'), case studies of music-playing humanoid robots (WF-4RIV by Solis & Takanishi at Waseda), and roboethics discussions (Ishihara on Japanese roboethics; Decker on autonomous service robots TA). Findings: cultural differences — Japan more amenable to humanoid embodiment and SF popular culture (Astro Boy, Doraemon) seeding robotics imaginaries, Germany more wary; both share uncertainty about everyday humanoid integration. Limitations: edited volume → variable quality and methods across chapters; small sample of two countries; no quantitative cross-national analysis; 2014 cutoff (predates current humanoid wave).", "relevance": "Supports H2 (Media Sequencing) and H3 (Selective Alignment): Nakao's chapter on Japanese popular culture explicitly traces manga (Astro Boy, Doraemon, Mazinger Z, Gundam) as the comics-layer that intermediates between books and modern Japanese humanoid robots — directly relevant to our Comics layer hypothesis. Supports H4: Japanese-government funding programs explicitly justified via SF popular culture. Method reuse: chapter-by-chapter mining for case studies; the music-robot work (Solis & Takanishi) is a useful data point for affect-dimension humanoid design. Character harvest: from Nakao's chapter — Astro Boy / Tetsuwan Atom, Doraemon, Mazinger Z, Tetsujin 28-go, Gundam, Patlabor, Evangelion, Ghost in the Shell; ARMAR humanoid (KIT, Germany); WF-4RIV Waseda Flutist robot."}, "GamalElDin2025": {"key": "GamalElDin2025", "authors": "Hend Samy Mohamed Gamal El-Din", "year": 2025, "title": "The Evolution of Humanoid Robots: A Posthuman Reading of the Sci-Fi A. I. Artificial Intelligence", "venue": "Bulletin of the Faculty of Arts (Suez Canal University), Vol. 85, April 2025", "priority": "medium", "summary": "Background: AI and humanoid robotics have advanced to the point where the essentialist dualism of human vs. machine is increasingly untenable, and SF cinema offers a privileged space to interrogate this collapse. Research question: how does Spielberg's A.I. Artificial Intelligence (2001) deconstruct the human/AI binary and dramatize a posthuman, 'digital-Darwinian' future where 'fittest' robots may replace humanity? Method: posthumanist literary/film analysis drawing on Ferrando, Braidotti, Moravec, Gray et al., Russell & Norvig, and Levy's Love and Sex with Robots; close reading of the film alongside Brian Aldiss's 1969 source story 'Supertoys Last All Summer Long.' Data: a single film case (A.I. Artificial Intelligence, 2001) plus its source short story, contextualized with real-world events (2023 SoFi Stadium humanoid promo, 2022 chess-robot finger-breaking incident, ChatGPT). Findings: the film blurs self/other through David's love-driven posthuman subjectivity, Gigolo Joe's affective companionship, and Teddy's hybrid agency, supporting a non-hierarchical posthuman ontology in which humans evolve into or are surpassed by their creations. Limitations: single-text close reading, no empirical corpus, primarily theoretical/philosophical, English-literature departmental framing.", "relevance": "Supports H3 (Selective Alignment) — focuses on affective and companionship tropes (love, motherhood, sexuality) as the migrating dimensions of humanoidness. Supports H1 by tracing fiction-to-reality lineages (Aldiss 1969 → Spielberg 2001 → 2023 SoFi humanoids). Method reuse: posthumanist coding of human/machine boundary collapse can sharpen our 'social role × affect' tagging in the Golden Table; useful as a humanities counterweight to Osawa's quantitative scheme. Characters to harvest: David, Gigolo Joe, Teddy, the Mecha-orgi creatures, Blue Fairy (A.I.); plus references to Siri, Alexa as real-world affective AI, and the wider Spielberg/Aldiss network of 'supertoys' for the Books and Films corpora."}, "JacobsEtAl2022": {"key": "JacobsEtAl2022", "authors": "Oliver L. Jacobs, Kamel Gazzaz, Alan Kingstone", "year": 2022, "title": "Mind the Robot! Variation in Attributions of Mind to a Wide Set of Real and Fictional Robots", "venue": "International Journal of Social Robotics 14", "priority": "medium", "summary": "Background: Gray et al.'s (2007) two-axis mind-perception framework (agency × experience) had only been validated on single robots with descriptive variants, leaving open whether it discriminates across a real-world robot landscape. Research question: does the Gray et al. mind-perception framework produce meaningful variance across a wide set of real and fictional robots, and are people more willing to perceive 'experience' (feeling) in robots than prior work suggested? Method: online Qualtrics survey on Amazon Mechanical Turk; each participant rated 24 characters on 0–100 agency and 0–100 experience scales; Greenhouse-Geisser-corrected mixed-model ANOVAs across robot × sex × age (median-split). Data: N = 123 MTurk experts (≥1000 prior tasks, ≥99% success), mean age 41.47 (SD 11.29), 55 F / 68 M, all US; 24 stimuli = humans (woman, dead person, baby, fetus, child, PVS), animals (dog, frog, chimp, bacteria), inanimate (rock, teddy bear, shovel), machines (Sophia, Sphero, R2-D2, Siri, Roomba, Maslo, Atlas, Beam, 'Future Conscious Robot', Alexa, Wall-E). Findings: significant variation exists across robots in both agency and experience — fictional robots scored highest; younger participants (≤38) rated robots higher on experience than older participants — a possible generational shift toward greater acceptance of robot sentience. Limitations: single-country MTurk sample, static images rather than video/interaction, 24 stimuli only, age as median split, no cross-cultural replication.", "relevance": "Directly supports H3 (Selective Alignment): affective/experience tropes (Wall-E, Maslo) generate stronger mind attribution than purely mechanical tropes (Roomba, Atlas) — exactly the migration pattern H3 predicts. Also supports H4: generational shift suggests cohort effects mediate institutional uptake. Method reuse: the agency × experience axes offer a ready-made two-dimensional scoring scheme for our Golden Table's 'humanoidness' dimensions (embodiment, social role, affect); the 24-character stimulus set is a mini-validation corpus for our embedding-based similarity measures. Characters to harvest directly: Wall-E, R2-D2, Siri, Sophia, Atlas, Roomba, Alexa, Sphero, Beam, Maslo, 'Future Conscious Robot' — all with empirical agency/experience scores that could anchor our semantic space."}, "KimKim2013": {"key": "KimKim2013", "authors": "Min-Sun Kim, Eun-Joo Kim", "year": 2013, "title": "Humanoid robots as 'The Cultural Other': are we able to love our creations?", "venue": "AI & Society 28(3)", "priority": "medium", "summary": "Background: as humanoid robots become more autonomous and present in everyday life, social/cultural/religious frameworks (Levinas's Other, Hall's representation, Davis's TechGnosis) become essential for predicting acceptance. Research question: how do humans conceive of humanoid robots as 'the Cultural Other,' and which of those framings are most compatible with peaceful long-term human-robot co-evolution? Method: theoretical synthesis essay drawing on multicultural Self/Other theory, intercultural communication research, and religious studies; develops a six-fold typology and evaluates each. Data: no empirical corpus — analytical sample of SF films (Terminator series, Star Wars, Star Trek), philosophical/religious sources (Levinas, Genesis, Brihadaranyaka Upanishad, the Golem legend), and HRI scholarship (Bartneck, Breazeal, MacDorman, Duffy). Findings: six framings — (1) Frightening Other, (2) Subhuman Other, (3) Human Substitute, (4) Sentient Other, (5) Divine Other, (6) Co-evolutionary Path to Immortality — with the last being the preferable/optimistic posthuman scenario; proposes 'loving non-living beings' as the path to human-robot mutual flourishing. Limitations: theoretical only, US/Korean cultural perspective, no measurement of public attitudes against the typology, no quantitative evidence.", "relevance": "Strongly supports H3 (Selective Alignment): the six-category Cultural-Other typology is a candidate label scheme for tagging humanoid tropes in our Books/Comics/Films corpus along an Frightening↔Co-evolutionary axis. Supports H4 by linking cultural frame to public acceptance, predicting which framings will translate into grant/patent uptake. Method reuse: directly adoptable as a coding scheme alongside Osawa's 9-element scheme and Saffari's 3-axis. Character harvest: the Terminator (Frightening), R2-D2/C-3PO (Subhuman/Helper), Stepford Wives (Substitute), Lt. Data (Sentient), the golem/Frankenstein (Divine creation gone wrong), Kurzweil's singularity entities (Co-evolutionary)."}, "Klass1983": {"key": "Klass1983", "authors": "Philip Klass", "year": 1983, "title": "The Artificial Alien: Transformations of the Robot in Science Fiction", "venue": "The ANNALS of the American Academy of Political and Social Science 470 (Robotics: Future Factories, Future Workers)", "priority": "medium", "summary": "Background: by 1983 industrial robotics had become a real economic force (Engelberger's Unimate; Japanese factory automation), and the special ANNALS issue gathered policy/social-science perspectives on 'Future Factories, Future Workers' — Klass (a working SF writer who published as William Tenn) was invited to provide the literary-historical perspective. Research question: how has the figure of the robot been transformed across SF literature, from Čapek's R.U.R. through Asimov's positronic robots to the modern android, and what does that arc tell us about cultural anxieties around mechanized labor? Method: literary-historical survey essay; close reading of canonical SF stories with attention to authorial-political context. Data: canonical SF corpus 1920s–1980s (R.U.R., Asimov's I, Robot and Caves of Steel, Lester del Rey's 'Helen O'Loy,' Eando Binder's 'I, Robot' / Adam Link stories, Jack Williamson's 'With Folded Hands,' etc.). Findings: the robot evolves from monstrous slave-revolt figure (R.U.R.) through Three-Laws-bound positronic worker (Asimov) toward the fully sentient artificial 'alien' that mirrors humanity — the cultural function shifts from anxiety about industrial labor to ontological inquiry about personhood. Limitations: no empirical or quantitative method, single-author critical essay, US/anglophone canon, predates the cyberpunk turn; published as scanned PDF (OCR-required for full text mining).", "relevance": "Strongly supports H1 (Temporal Lead) — Klass is a primary source documenting that Asimov's 1940s Three Laws preceded industrial robotics' real adoption (Engelberger 1958/61). Supports H3 by tracing the shift from mechanical-slave to social/affective robot — exactly the dimension H3 says migrates most strongly. Method reuse: the periodization (Čapek-era robot revolt → Asimov-era positronic worker → modern artificial alien) is a candidate decade-binning scheme for our Golden Table. Character harvest: Rossum's Universal Robots (R.U.R.); Asimov's Susan Calvin, R. Daneel Olivaw, Powell & Donovan, Cutie (QT-1); Eando Binder's Adam Link; del Rey's Helen O'Loy; Williamson's Humanoids ('With Folded Hands'). Note: this PDF requires OCR before text-mining — flag for the embedding pipeline."}, "Moylan2014": {"key": "Moylan2014", "authors": "Tom Moylan (Edited by Raffaella Baccolini)", "year": 2014, "title": "Demand the Impossible: Science Fiction and the Utopian Imagination (Ralahine Classics edition)", "venue": "Peter Lang (Ralahine Utopian Studies, Ralahine Classics), ISBN 978-3-0353-0610-1 (originally Methuen 1986)", "priority": "medium", "summary": "Background: in the 1970s and early 1980s, SF underwent a 'critical-utopia' renaissance (Joanna Russ, Ursula K. Le Guin, Marge Piercy, Samuel R. Delany) that revived the utopian impulse after its mid-century decline. Research question: how do these 'critical utopias' rewrite the classical-utopian tradition (More, Bellamy, Wells) by acknowledging utopia's flaws and possibilities, and what is their political-imaginative work in the late-Cold War period? Method: literary-critical analysis combined with Marxist/Frankfurt-School critical theory (Bloch, Marcuse, Jameson, Suvin, Levitas); close readings of four key novels framed as 'indicative texts' of a broader utopian intertext. Data: four primary texts — Joanna Russ, The Female Man (1975); Ursula K. Le Guin, The Dispossessed (1974); Marge Piercy, Woman on the Edge of Time (1976); Samuel R. Delany, Triton (1976); Ralahine Classics edition adds a new Moylan essay on Aldous Huxley's Island plus reflections by leading utopian/SF scholars. Findings: introduces the concept of 'critical utopia' — utopian fictions that self-consciously question the perfection of utopian ideals while preserving the imaginative drive toward 'better worlds'; provides the periodizing framework (utopia's recovery in the 1970s) widely adopted in subsequent utopian studies and now central to Alacovska2025's 'sci-fi capital' argument. Limitations: literary-critical, US/anglophone canon, not focused on humanoid robots specifically.", "relevance": "Supports H3 (Selective Alignment) on the utopian/dystopian polarity dimension — Moylan's 'critical utopia' framework underpins Alacovska2025's analysis of how humanoid-robotics entrepreneurs deploy utopian imagination as 'sci-fi capital.' Indirect support for H1 (Temporal Lead) via the 1970s revival timeline. Method reuse: the eutopia/dystopia/critical-utopia tri-partition is a candidate label set for tagging Books/Films layer; useful for clustering 'machine uprising' vs. 'companion robot' tropes by utopian valence. Character harvest: limited direct relevance (the four primary novels are gender/society utopias, not robot stories), but useful for the broader utopian-imaginary frame."}, "Schelde1993": {"key": "Schelde1993", "authors": "Per Schelde", "year": 1993, "title": "Androids, Humanoids, and Other Science Fiction Monsters: Science and Soul in Science Fiction Films (Introduction)", "venue": "New York University Press (NYU Press), ISBN 9780814788752", "priority": "medium", "summary": "Background: by 1993 SF film had become a dominant mass-cultural genre, but serious book-length studies were almost non-existent (only Johnson 1972 and Kuhn's Alien Zone 1990); Schelde's monograph fills that gap with a folkloristic/anthropological reading. Research question: how do SF films function as modern folklore — what cultural work do their androids, humanoids, and monsters perform that traditional folk-tales used to do, and what is the relation between science, soul, and scientist-as-magician in these films? Method: folkloristic / anthropological / structural analysis of SF films, building on Schelde's earlier work on Henrik Ibsen folklore (Jacobsen [Schelde] & Leavy 1988) and Freud's note about cinema as 'modern folklore.' Data: a broad SF-film corpus from Frankenstein (1931) through Blade Runner, Alien, Terminator, RoboCop, and 1990s genre output, plus tabloid/popular-belief sources used as cultural barometers. Findings: SF film inherits the folkloric structural slot of human-vs-nature narrative, with androids/humanoids/aliens replacing trolls/ogres; the 'mad scientist' figure is the modern shaman; SF-film effects (rather than ideas) drive its mass appeal. Limitations: monograph chapter is theoretical/qualitative, no quantitative coding, pre-2000 (no cyberpunk/CGI era), and limited engagement with non-Western SF film.", "relevance": "Foundational reference for H1 (Temporal Lead) and H3 (Selective Alignment): Schelde's argument that SF film carries forward folkloric structures gives a deep-time framing for why fiction precedes — and pre-figures — engineering imaginaries. Supports H2 (Media Sequencing) since the book explicitly differentiates SF literature from SF film as audiences and traditions. Method reuse: the folklore/anthropology lens (folktale function categories) is a candidate parallel taxonomy to Osawa's 4 clusters; the comparative literature/film distinction is exactly what we need for the Books vs. Films vs. Comics partition. Characters/works to harvest: full 1980s–early-90s SF film canon (Frankenstein, Metropolis, Forbidden Planet, 2001, Star Wars, Alien, Blade Runner, Terminator, RoboCop, Total Recall, etc.) — most overlap with Saffari 2021's 108 FRs."}, "Tutton2020": {"key": "Tutton2020", "authors": "Richard Tutton", "year": 2020, "title": "Sociotechnical Imaginaries as Techno-Optimism: Examining Outer Space Utopias of Silicon Valley", "venue": "Science as Culture (online), DOI 10.1080/09505431.2020.1841151", "priority": "medium", "summary": "Background: Silicon Valley entrepreneurs (Bezos/Blue Origin, Diamandis/Planetary Resources, Musk/SpaceX) have invested billions in human spaceflight, framed by techno-optimistic SF-inflected visions of Mars settlement and asteroid mining. Research question: how do these techno-optimistic outer-space sociotechnical imaginaries operate as utopian/libertarian visions, what role do SF narratives and digital simulations play in conveying their feasibility, and how do they intersect with Anthropocene pessimism about Earth's future? Method: STS analysis grounded in Jasanoff & Kim's sociotechnical-imaginaries framework + Messeri's social studies of outer space + critical-theory readings; multi-case discourse analysis. Data: corpus of corporate communications, founder talks, press coverage, simulation videos for SpaceX / Blue Origin / Planetary Resources / Mars One; references to SF (The Expanse, Andy Weir's The Martian, Star Trek), and to Macdonald's geographies-of-space scholarship. Findings: Silicon Valley space utopias function as techno-optimist sociotechnical imaginaries that mobilize SF narratives + digital simulations to recruit investors and publics; opposed by Anthropocene pessimism about Earthly collapse; risk: visions impede flourishing on Earth even when ambitious in design. Limitations: qualitative, US Silicon Valley focus, not directly about humanoid robots (though similar mechanisms).", "relevance": "Indirect support for H4 (Institutional Uptake) — the sociotechnical-imaginaries framework + Silicon Valley case is parallel to humanoid-robotics entrepreneurship (Alacovska2025 builds on the same logic). Useful as a comparison case: outer-space optimism vs. humanoid-robot optimism share the same fictional-imagination-attracts-capital mechanism. Method reuse: Tutton's discourse-analysis template for tracing SF→corporate vision→investment can be ported to humanoid robotics ventures. Character harvest: limited (focus is on real entrepreneurs and outer-space scenarios), but provides theoretical framing that complements Alacovska 2025's 'sci-fi capital.' Recommend MEDIUM priority (relevant by analogy and framework, not by primary humanoid focus)."}, "Viidalepp2020": {"key": "Viidalepp2020", "authors": "Auli Viidalepp", "year": 2020, "title": "Representations of robots in science fiction film narratives as signifiers of human identity", "venue": "Információs Társadalom (Information Society) XX(4), 19–36", "priority": "medium", "summary": "Background: while earlier SF placed robots in distant futures, the past decade (2013–) has produced popular series featuring humanoid robots in near-present sociotopes (Humans, Westworld, Ex Machina, Her, Jexi), making the human/machine boundary newly urgent for cultural analysis. Research question: what do fictional robots in recent SF film/TV signify, and how do their narratives function as Ricoeur-style 'thought experiments' with human identity? Method: qualitative semiotic analysis using Tartu-Moscow cultural semiotics (Lotman's 'art as modelling system,' unpredictability, semiosis-as-choice via Kull), Ricoeur's identity dialectic, and Haynes's scientist stereotypes; full series viewed up to 2020 with notes on human-machine oppositions. Data: four near-present SF series — Humans (Channel 4 UK, 2015–18, three seasons; based on Real Humans / Äkta människor SE 2012–14), Westworld (HBO 2016–, three seasons), Are You Human? (Neodo Inganini KR 2018, Netflix), Better than Us (Лучше, чем люди RU 2018) — all with IMDb avg ratings ≥7/10 and Rotten Tomatoes ≥80%; sample table cataloguing storyworld, human characters, robot types, and extra-textual references. Findings: artificial characters in these series have greater behavioral analogy with humans than with machines; their robot-makers (scientists) embody Haynes's archetypes with hidden agendas; the realistic sociotopes blur fictional/extra-textual boundaries and feed back into public discourse on data, privacy, and HRI. Limitations: 4 series only, all from 2015–18, no quantitative coding or inter-rater reliability, single-author qualitative reading, English-language reception only.", "relevance": "Strongly supports H2 (Media Sequencing) — adds TV-series as an intermediate layer between books/films and grants/patents, similar to comics in our H2 framework. Strongly supports H3 (Selective Alignment): the affective and identity-signifier dimensions are the migrating tropes. Method reuse: Ricoeur identity dialectic + Haynes scientist-archetypes give us tagging axes; the 4-series case-study format is a template for adding TV as a fifth media layer (Books, Comics, Films, TV, Grants/Patents). Character harvest: full Humans/Westworld cast (Anita/Mia, Niska, Hester, Odi; Dolores, Maeve, Bernard, Ashley, Hosts, V; Rehoboam, Solomon), Are You Human?'s Nam Shin III, Better than Us synths."}, "ChenEtAl2016": {"key": "ChenEtAl2016", "authors": "Xiuwen Chen, Jianming Chen, Dengsheng Wu, Yongjia Xie, Jing Li", "year": 2016, "title": "Mapping the research trends by co-word analysis based on keywords from funded project", "venue": "Procedia Computer Science 91", "priority": "low", "summary": "Background: bibliometric / co-word analysis typically uses keywords from published papers, but publications lag grant funding by 2–4 years, so hot research fronts are under-detected. Research question: can keywords extracted directly from funded projects (rather than papers) reveal more timely research trends in Management Science & Engineering? Method: co-occurrence matrix + clustering in VOSviewer and Ucinet, Pearson-correlation similarity, k-core network analysis, and density visualization on a binary matrix. Data: 7,304 NSFC-funded Management Science & Engineering projects (General, Youth, Regional) 2011–2015; 2,054 projects with application code G01; 6,153 keywords with 9,348 occurrences; 100 high-frequency keywords (frequency ≥8) retained. Findings: hot topics are Game Theory, Supply Chain Management, Data Mining, Complex Network, Optimize, Risk Management, DEA, Computational Experiment, Pricing; 8 thematic clusters identified, most research fields still immature. Limitations: single country, single discipline code (G01), frequency-cutoff sensitivity, and no author- or institution-level network features.", "relevance": "Supports H4 (Institutional Uptake) methodologically: provides the template for co-word/k-core analysis of NSF/NIH grant abstracts to detect when 'humanoid' / 'social robotics' keywords ignite. Method reuse (high priority): adopt this paper's pipeline — keyword frequency counts → co-occurrence matrix → k-core + cluster analysis → density visualization — applied to our NSF/NIH (Program Code 1444) grant abstracts, and to the USPTO CPC Y10S901 patents. Useful threshold heuristic: frequency ≥8 retained; could be tuned for our smaller humanoid-specific corpus. No fictional characters or works — purely method-donor paper."}, "MarcusWang2018": {"key": "MarcusWang2018", "authors": "Aaron Marcus, Wentao Wang (Eds.)", "year": 2018, "title": "Design, User Experience, and Usability: Designing Interactions (DUXU 2018, Part II, LNCS 10919)", "venue": "Springer Lecture Notes in Computer Science (HCI International 2018)", "priority": "low", "summary": "Background: the DUXU (Design, User Experience, Usability) track of HCII 2018 gathers research on design futures, interaction design, and user-centered methods. Research question: varies by chapter — the volume as a whole addresses how to design and evaluate interactions for emerging technologies. Method: edited proceedings; each chapter brings its own empirical or design method (user studies, prototypes, qualitative interviews, design-fiction pieces). Data: multi-paper volume — no single dataset; roughly 50 contributed papers covering mobile UX, service design, smart cities, gamification, and design-fiction. Findings: collectively advances the state of design practice for emerging interactive systems, but no unified findings at the volume level. Limitations: heterogeneous quality/methods; not focused on humanoid robots or SF per se; relevance to the current project is mostly via the occasional design-fiction or HRI-UX chapter.", "relevance": "Supports H3/H4 only weakly: the volume provides background on how design-fiction feeds industrial HCI practice, relevant for interpreting why certain humanoid tropes appear in patents. Method reuse: individual chapters can be mined for HCI method templates (scenario-based design, design fiction, Wizard-of-Oz studies) if we ever need to analyze UX dimensions of humanoid robot patents. No fictional characters or works at the volume level (would need to examine individual chapters). Lowest-priority item in our literature set — consider treating as peripheral."}, "Sarkar2023": {"key": "Sarkar2023", "authors": "Jaya Sarkar", "year": 2023, "title": "(Re)claiming the Non-animal: Interrogating Anthropocentrism Through Samit Basu's Turbulence", "venue": "Posthumanism and the Ecological Crisis (eds. Mukulika Dattagupta & Anandita Das, Brainware University, ISBN 978-81-952892-5-7), pp. 32–37", "priority": "low", "summary": "Background: postcolonial-posthumanism scholarship asks how speculative fiction from the Global South challenges Western humanist hierarchies of human/animal/machine. Research question: how does Samit Basu's Turbulence (2012/2014), an Indian superhero novel, deconstruct speciesism and ableism via characters who morph into animals, and what does that imply for posthuman trans-species solidarity? Method: postcolonial-posthumanist literary close reading drawing on Braidotti, Stacy Alaimo, Bill Ashcroft, Karen Barad, Riley; situates the novel within the Brainware University 2022 'Posthumanism and Ecological Crisis' national conference. Data: single primary text — Samit Basu's Turbulence (2012/2014) — with theoretical apparatus from Western posthumanism. Findings: Sher and Mukesh's voluntary animal-shifts collapse the human/non-human binary, evicting the human from the centre and granting animals 'individual' status (per Alaimo); the novel models trans-species solidarity as an Indian/postcolonial counter to Western speciesism. Limitations: single-text analysis, no empirical method, conference-proceedings publication with light peer review, marginal direct relevance to the humanoid-robot question (focuses on animal-shifters, not robots).", "relevance": "Marginal-but-non-zero relevance. Mostly supports H3 (Selective Alignment) on the conceptual side: posthumanist non-hierarchical framing of human/non-human is the same theoretical axis along which 'humanoid affect' migrates. Useful as a Books-corpus seed for non-Western SF (Samit Basu, Indian English-language sci-fi). Method reuse: lowest priority — the postcolonial-posthuman frame could become a coding axis if we extend the Books layer to non-Western fiction. Character harvest: Sher and Mukesh (animal-shifters), Vir Singh, Aman Sen, Tia (Turbulence). Recommend treating as peripheral (P3) in the Golden Table — useful for Books diversification but not central to humanoid-robot tropes."}, "Wright2010": {"key": "Wright2010", "authors": "Erik Olin Wright", "year": 2010, "title": "Envisioning Real Utopias", "venue": "Verso (London), ISBN 978-1-84467-617-0", "priority": "low", "summary": "Background: by the mid-2000s, neoliberal capitalism's dominance had been reinforced by the lack of credible alternatives following the collapse of state socialism; Wright's project (developed across the Real Utopias volumes, 1995–2010) sought to revive systemic alternatives through empirically-grounded analysis. Research question: what would constitute a 'real utopia' — an institutional alternative to capitalism that is desirable, viable, and achievable — and how should sociologists analyze and pursue such alternatives? Method: theoretically-driven sociology integrating analytical Marxism, critical theory, and institutional/economic analysis; case studies of really-existing alternatives (participatory budgeting, worker cooperatives, basic income, Wikipedia) tested against the desirability/viability/achievability framework. Data: institutional case studies — Porto Alegre participatory budgeting, Mondragon cooperatives, Wikipedia commons-based peer production, basic-income experiments, Quebec social-economy sector, gender egalitarianism reforms; theoretical apparatus from Marx, Habermas, Habermas's deliberative democracy, Roemer, and his own structures-of-class-analysis. Findings: 'real utopias' provide concrete institutional templates that constitute partial transcendence of capitalism; the desirability/viability/achievability triad is a portable evaluative framework; transformation requires 'ruptural,' 'symbiotic,' and 'interstitial' strategies. Limitations: theoretical-empirical sociology, not focused on humanoid robots or SF imaginaries (though utopian imagination is central); pre-AI/pre-LLM era.", "relevance": "Marginal direct relevance for the humanoid-robot project. Provides theoretical context for the 'utopian imagination' construct that runs through Moylan2014, Alacovska2025, and Tutton2020, but does not engage SF, robotics, or fiction-to-engineering pipelines. Useful at most as a background reference for how utopian sociology treats institutional alternatives. Method reuse: low — the desirability/viability/achievability triad could be borrowed for evaluating proposed humanoid-robot futures, but it's a stretch. Character harvest: none (no fictional characters; the cases are real-world institutional alternatives like Mondragon and Wikipedia). Recommend LOW priority — keep for theoretical context but de-prioritize for the humanoid-robot focus."}, "Beckert2016": {"key": "Beckert2016", "authors": "Jens Beckert", "year": 2016, "title": "Imagined Futures: Fictional Expectations and Capitalist Dynamics", "venue": "Harvard University Press, ISBN 9780674088825", "priority": "high", "summary": "Argues that capitalism is driven by 'fictional expectations' — narratives about the future that are inherently uncertain but structure present economic action (investment, innovation, consumption).", "relevance": "Foundational text. Directly theorizes the fiction-to-reality pipeline through capitalist dynamics. Essential for RQ1 (commercialization), RQ2 (investor channel), RQ3 (cycle patterns)."}, "CallonLawRip1986": {"key": "CallonLawRip1986", "authors": "Michel Callon, John Law, Arie Rip (eds.); Callon ch.2", "year": 1986, "title": "Mapping the Dynamics of Science and Technology (Ch.2: The Sociology of an Actor-Network: The Case of the Electric Vehicle)", "venue": "Macmillan Press, ISBN 0-333-37223-9", "priority": "high", "summary": "Foundational ANT text. Callon's Ch.2 analyzes the failed French electric vehicle program, showing how success depends on enrollment and translation across heterogeneous networks, not inherent technical merit.", "relevance": "Indispensable for RQ4 (ANT framework). Provides the entire theoretical vocabulary (actors, networks, translation, enrollment). Also strong for RQ3 (timeline of dissemination)."}, "vanLenteMulder1993": {"key": "vanLenteMulder1993", "authors": "Harro van Lente, Karel Mulder", "year": 1993, "title": "The Dynamics of Expectations in Scientific and Technological Development", "venue": "Conference paper (NOTA-funded); cf. Technology Analysis & Strategic Management 15(2), 2003", "priority": "high", "summary": "Introduces the 'cultural matrix of expectations' — shared heterogeneous expectations that structure tech development via cognition, action-guiding, and legitimation. Illustrated through the Tenax case (AKZO polymer project).", "relevance": "Core text for RQ3 (cycle dynamics, hype patterns) and RQ4 (actor interactions). 'Cultural matrix of expectations' directly operationalizes how fictional futures structure tech development."}, "BareisEtAl2023": {"key": "BareisEtAl2023", "authors": "Jascha Bareis, Maximilian Roßmann, Frédérique Bordignon", "year": 2023, "title": "Technology hypes: Practices, approaches and assessments", "venue": "TATuP 32(3): 11-16, DOI 10.14512/tatup.32.3.11", "priority": "high", "summary": "Intro to special issue on technology hype. Distinguishes hype from visions/imaginaries by temporal urgency and emotional appeal. Critiques Gartner hype cycle. Discusses rhetorical, temporal, and institutional dimensions.", "relevance": "Most directly relevant to RQ3 (hype/fear cycles, temporal dynamics, leading/lagging). Also strong for RQ2 (public engagement channel)."}, "BensaudeVincent2014": {"key": "BensaudeVincent2014", "authors": "Bernadette Bensaude Vincent", "year": 2014, "title": "The Politics of Buzzwords at the Interface of Technoscience, Market and Society", "venue": "Public Understanding of Science 23(3): 238-253", "priority": "high", "summary": "Analyzes buzzwords as 'linguistic technologies' at the technoscience-market-society interface. Shows they perform three functions: generate concern, set agendas, create unstable collectives. Productive despite semantic vagueness.", "relevance": "Strong for RQ2 (public engagement) and RQ3 (buzzword lifecycle as hype proxy). Provides linguistic mechanism connecting fictional narratives to adoption."}, "RipTeKulve2008": {"key": "RipTeKulve2008", "authors": "Arie Rip, Haico te Kulve", "year": 2008, "title": "Constructive Technology Assessment and Socio-Technical Scenarios", "venue": "In: Fisher et al. (eds.), Yearbook of Nanotechnology in Society, Vol. 1, Ch. 4, Springer", "priority": "high", "summary": "Develops socio-technical scenarios for CTA. Since nanotech apps are 'social science fiction,' CTA uses scenarios to identify emerging irreversibilities and modulate development. Two types: concentric and multi-level.", "relevance": "Strong for RQ4 (prospective actor-network methodology) and RQ1 (policy-sociotechnical). 'Useful fictions' framing connects to fiction-to-reality framework."}, "ReijersCoeckelbergh2018": {"key": "ReijersCoeckelbergh2018", "authors": "Wessel Reijers, Mark Coeckelbergh", "year": 2018, "title": "The Blockchain as a Narrative Technology: Investigating the Social Ontology and Normative Configurations of Cryptocurrencies", "venue": "Philosophy & Technology 31: 103-130", "priority": "medium", "summary": "Proposes 'narrative technologies' framework — tech that, like texts, configures social reality through emplotment. Applied to blockchain: rigidifies financial plots, abstracts human interaction, creates interpretive distances.", "relevance": "Useful for conceptual depth (tech as narrative) but less directly applicable than expectations/hype lit. Strongest for RQ1 and novel angle on RQ5."}, "Berardi2017": {"key": "Berardi2017", "authors": "Franco 'Bifo' Berardi", "year": 2017, "title": "Futurability: The Age of Impotence and the Horizon of Possibility", "venue": "Verso Books, London/New York", "priority": "medium", "summary": "Critical theory on how capitalism creates paradox: infinite technological possibility alongside political impotence. Distinguishes possibility, potency, and power. Argues for recovering collective potency against capitalist determinism.", "relevance": "Important philosophical context on futurism and political economy of future-making. Less operationalizable than expectations/ANT literature. Best as background."}, "BorupEtAl2006": {"key": "BorupEtAl2006", "authors": "Mads Borup, Nik Brown, Kornelia Konrad, Harro Van Lente", "year": 2006, "title": "The Sociology of Expectations in Science and Technology", "venue": "Technology Analysis & Strategic Management 18(3-4): 285-298", "priority": "high", "summary": "Foundational review establishing 'sociology of expectations' as a field. Expectations are performative — they mobilize resources, attract actors, legitimize action, and guide search heuristics. Discusses how expectations circulate, get inflated, and collapse in hype-disappointment cycles.", "relevance": "THE canonical text for sociology of expectations. Essential for RQ3 (cycle dynamics) and RQ4 (how expectations build actor-networks). 27,000+ views, 367 citations."}, "AdamsEtAl2009": {"key": "AdamsEtAl2009", "authors": "Vincanne Adams, Michelle Murphy, Adele E. Clarke", "year": 2009, "title": "Anticipation: Technoscience, Life, Affect, Temporality", "venue": "Subjectivity 28: 246-265", "priority": "high", "summary": "Defines anticipation as a defining quality of contemporary technoscience — living toward the future via speculative forecast, injunction, abduction, optimization, and preparedness. Anticipation has epistemic value and produces what it predicts.", "relevance": "Key for RQ3 (temporality framework) and RQ2 (government/public channels). Complements Borup et al. by adding affect and embodiment dimensions."}, "Kirby2003": {"key": "Kirby2003", "authors": "David A. Kirby", "year": 2003, "title": "Scientists on the Set: Science Consultants and the Communication of Science in Visual Fiction", "venue": "Public Understanding of Science 12(3): 261-278", "priority": "high", "summary": "Explores how science consultants shape fictional films and how film naturalizes both 'accurate' and 'inaccurate' science via a perceptually realistic framework. Precursor to Kirby's later 'diegetic prototypes' concept.", "relevance": "Origin text for understanding HOW scientists embed real tech in fiction. Precursor to 'diegetic prototypes' (Kirby 2010). Essential for RQ2 (expert channel) and RQ4 (scientist-filmmaker actor network)."}, "Bleecker2009": {"key": "Bleecker2009", "authors": "Julian Bleecker", "year": 2009, "title": "Design Fiction: A Short Essay on Design, Science, Fact and Fiction", "venue": "Near Future Laboratory", "priority": "high", "summary": "Foundational text coining 'design fiction' — the practice of using fiction as a design tool to create provocative prototypes that blur fact and fiction. Argues fiction is valuable because it allows low-cost experimentation.", "relevance": "Foundational for understanding fiction as a design method (RQ1 product). Complements Kirby's diegetic prototypes from the design side."}, "ShedroffNoessel2012": {"key": "ShedroffNoessel2012", "authors": "Nathan Shedroff, Chris Noessel", "year": 2012, "title": "Make It So: Learning From Sci-fi Interfaces", "venue": "AVI '12, ACM, Capri Island, Italy", "priority": "high", "summary": "5-year investigation of SF interfaces in film/TV. Identifies 4 categories of SF influence on real interface design: Inspiration, Setting Expectations, Social Context, and Proposing New Paradigms. Concrete examples (X-Men→Xenotran Sand Table, Star Trek→Motorola flip phone).", "relevance": "Most empirically concrete fiction→product study. Essential for RQ1 (commercialization with named examples), RQ5 (which works transfer and why), and RQ2 (engineer channel)."}, "KomporozosAthanasiou2022": {"key": "KomporozosAthanasiou2022", "authors": "Aris Komporozos-Athanasiou", "year": 2022, "title": "Speculative Communities: Living with Uncertainty in a Financialized World", "venue": "University of Chicago Press", "priority": "high", "summary": "Argues that speculation (financial and imaginative) has become the dominant mode of community formation in contemporary capitalism. Speculative communities form around shared imagined futures — from crypto to populism.", "relevance": "Strong for RQ2 (investor channel), RQ3 (speculative cycles), and RQ4 (community as actor). Bridges Beckert's economic sociology with Jasanoff's imaginaries."}, "Jameson2005": {"key": "Jameson2005", "authors": "Fredric Jameson", "year": 2005, "title": "Archaeologies of the Future: The Desire Called Utopia and Other Science Fictions", "venue": "Verso Books", "priority": "medium", "summary": "Major Marxist literary theory of SF and utopia. Argues SF's value is not prediction but 'cognitive estrangement' — making the present visible by constructing alternatives. SF performs the desire for systemic change.", "relevance": "Important theoretical backdrop for understanding SF's political function. Less operationalizable but provides the 'why SF matters' framing."}, "WestfahlEtAl2011": {"key": "WestfahlEtAl2011", "authors": "Gary Westfahl, Wong Kin Yuen, Amy Kit-Sze Chan (eds.)", "year": 2011, "title": "Science Fiction and the Prediction of the Future: Essays on Foresight and Fallacy", "venue": "McFarland (Critical Explorations in SF and Fantasy, 27)", "priority": "medium", "summary": "Essay collection examining SF's track record at prediction — both successes (foresight) and failures (fallacy). Multi-author, multi-case analysis of prediction dynamics in SF.", "relevance": "Most directly relevant to RQ5 (prediction accuracy) and RQ3 (temporal lead). Provides the empirical cases needed to train/validate a prediction model."}, "vanHulstVisser2025": {"key": "vanHulstVisser2025", "authors": "Merlijn van Hulst, E. Lianne Visser", "year": 2025, "title": "Abductive Analysis in Qualitative Research", "venue": "Public Administration Review 85(2): 567-580", "priority": "medium", "summary": "Methodological paper on abductive analysis — reasoning that moves between data and theory to generate surprising explanations. Formalizes abduction as a research method for qualitative social science.", "relevance": "Useful as methodological reference for your own research design (abductive reasoning between SF data and tech reality), but not directly about the framework questions."}, "Gulli2025": {"key": "Gulli2025", "authors": "Antonio Gulli", "year": 2025, "title": "Agentic Design Patterns: A Hands-On Guide to Building Intelligent Systems", "venue": "Preprint / Amazon", "priority": "low", "summary": "Technical guide on agentic AI design patterns — prompt chaining, routing, parallelization, reflection, tool use, multi-agent, memory management, MCP, RAG. Practical implementation reference.", "relevance": "Potentially useful as a technical resource if building LLM-based analysis tools, but not literature for the framework itself."}}, "characters": [{"name": "The Terminator", "count": 15, "valence": "mixed", "motifs": {"utopian": 1, "dystopian": 0, "uprising": 0, "companion": 0, "threat": 1, "labor": 0, "sex_gender": 0, "uncanny": 0, "singularity": 0, "surveillance": 0, "cognition": 0, "maker_anxiety": 0, "embodied_humanoid": 0, "real_counterpart": 0, "inspired_research": 0, "cited_in_policy": 0}, "papers": "Alacovska2025, Denia2025, Goode2018, HudsonEtAl2021, Jesse2005, KimKim2013, KrizEtAl2010, LorencikEtAl2013, MeineckeVoss2018, MubinEtAl2019, Richardson2015, Schelde1993, SermanetEtAl2025, Szollosy2017, Viidalepp2020"}, {"name": "HAL 9000", "count": 14, "valence": "neutral", "motifs": {"utopian": 0, "dystopian": 0, "uprising": 0, "companion": 0, "threat": 0, "labor": 0, "sex_gender": 0, "uncanny": 0, "singularity": 1, "surveil const VAL_OF_MOTIF = PAYLOAD.valence_of_motif;
const FEATURES = ["embodied_humanoid","cognition","real_counterpart","inspired_research"];
const FEATURE_LABEL = {
  embodied_humanoid: "humanoid body",
  cognition: "mind / sentience",
  real_counterpart: "real-world counterpart",
  inspired_research: "inspired real R&D",
};
const VAL_COLOR = {
  utopian:   "#27ae60",
  dystopian: "#c0392b",
  mixed:     "#e67e22",
  neutral:   "#7f8c8d",
};

let mode = "characters";       // "characters" | "works"
let minCount = 2;
let searchQ = "";
let network = null;
let cachedNodes = {characters: null, works: null};
let cachedEdges = {characters: null, works: null};

function entitiesFor(mode) { return mode === "characters" ? PAYLOAD.characters : PAYLOAD.works; }
function edgesFor(mode)    { return mode === "characters" ? PAYLOAD.char_edges : PAYLOAD.work_edges; }

function buildVisData() {
  const ents = entitiesFor(mode);
  const edges = edgesFor(mode);
  const visibleSet = new Set();
  const nodes = ents
      .filter(e => e.count >= minCount)
      .filter(e => !searchQ || e.name.toLowerCase().includes(searchQ))
      .map(e => {
        visibleSet.add(e.name);
        return {
          id:    e.name,
          label: e.name,
          value: e.count,
          color: { background: VAL_COLOR[e.valence] || VAL_COLOR.neutral,
                   border:     VAL_COLOR[e.valence] || VAL_COLOR.neutral,
                   highlight:  { background: "#fff", border: "#1d4ed8" } },
          font:  { face: "Helvetica Neue", size: 13, color: "#1f2937",
                   strokeWidth: 4, strokeColor: "#ffffff" },
          title: `${e.name}\n${e.count} paper(s) · valence: ${e.valence}`,
          shape: "dot",
        };
      });
  const visEdges = edges
      .filter(e => visibleSet.has(e.from) && visibleSet.has(e.to))
      .map(e => ({
        from: e.from, to: e.to, value: e.weight,
        color: { color: "rgba(120,120,120,0.18)", highlight: "#1d4ed8" },
        smooth: false,
      }));
  return { nodes, edges: visEdges };
}

function render() {
  const data = buildVisData();
  const container = document.getElementById("network");
  const options = {
    nodes: { borderWidth: 1.4, shape: "dot",
             scaling: { min: 8, max: 38,
                        label: { enabled: true, min: 11, max: 18, drawThreshold: 1, maxVisible: 24 } } },
    edges: { width: 0.5, scaling: { min: 0.4, max: 4 }, smooth: false, hoverWidth: 1.5 },
    physics: {
      enabled: true,
      stabilization: { enabled: true, iterations: 120, fit: true,
                       updateInterval: 25 },
      barnesHut: { gravitationalConstant: -2400, springLength: 130,
                   springConstant: 0.02, damping: 0.5,
                   avoidOverlap: 0.4 },
      maxVelocity: 35,
      minVelocity: 0.75,
    },
    interaction: { hover: true, tooltipDelay: 120, hideEdgesOnDrag: true,
                   navigationButtons: true, multiselect: false,
                   keyboard: { enabled: true } },
  };
  if (network) { network.destroy(); network = null; }
  network = new vis.Network(container, data, options);
  // Freeze physics once stabilised — keeps the page responsive
  network.once("stabilizationIterationsDone", () => {
    network.setOptions({ physics: { enabled: false } });
  });
  network.on("selectNode", params => showPanel(params.nodes[0]));
  network.on("deselectNode", () => clearPanel());
  document.getElementById("stats").innerHTML =
      `<b>${data.nodes.length}</b> nodes · <b>${data.edges.length}</b> edges<br>` +
      `${PAYLOAD.meta.n_papers} papers · ${PAYLOAD.meta.n_chars} chars · ${PAYLOAD.meta.n_works} works`;
}

function showPanel(name) {
  const e = entitiesFor(mode).find(x => x.name === name);
  if (!e) return clearPanel();
  const valBadge = `<span class="badge ${e.valence}">${e.valence}</span>`;
  const countPill = `<span class="count-pill">📄 ${e.count} paper(s)</span>`;
  const topicMotifs = PAYLOAD.motifs.filter(m => e.motifs[m] === 1 && !FEATURES.includes(m));
  const featureMotifs = FEATURES;
  const topicChips = topicMotifs.length
      ? topicMotifs.map(m => {
          const v = VAL_OF_MOTIF[m] || "feature";
          return `<span class="topic-chip ${v}">${m.replace(/_/g," ")}</span>`;
        }).join("")
      : `<span class="topic-chip">none tagged</span>`;
  const featureRows = featureMotifs.map(f => {
    const yes = e.motifs[f] === 1;
    return `<div class="feature-row ${yes ? "yes" : "no"}">
              <div class="check">${yes ? "✓" : ""}</div>
              <div class="name">${FEATURE_LABEL[f]}</div>
            </div>`;
  }).join("");
  const paperOrder = ["high","medium","low"];
  const sortedPapers = [...e.papers].sort((a,b) => {
    const pa = paperOrder.indexOf(a.priority), pb = paperOrder.indexOf(b.priority);
    if (pa !== pb) return pa - pb;
    return (b.year || 0) - (a.year || 0);
  });
  const paperCards = sortedPapers.map(p => {
    const desireFlag = p.desire ? `<span class="paper-flag desire">desire</span>` : "";
    const inventFlag = p.invent ? `<span class="paper-flag invent">invention</span>` : "";
    const excerpt = (p.excerpt || "").trim() || "(no in-text mention found in this paper's prose; entity is listed only in the curated character/work column)";
    return `<div class="paper-card ${p.priority}">
      <div><span class="paper-key">${p.key}</span>
           <span class="paper-priority ${p.priority}">${p.priority[0]}p</span></div>
      <div class="paper-meta">${p.year ? p.year + " · " : ""}${escapeHtml(p.authors)}</div>
      <div class="paper-meta" style="font-style:italic">${escapeHtml(p.title)}</div>
      <div style="margin:6px 0 4px">${desireFlag}${inventFlag}</div>
      <div class="paper-excerpt">${escapeHtml(excerpt).slice(0,650)}${excerpt.length>650?"…":""}</div>
    </div>`;
  }).join("");

  document.getElementById("side-panel").innerHTML = `
    <h2>${escapeHtml(e.name)}</h2>
    <div class="meta-row">${valBadge}${countPill}</div>

    <div class="section-title">Wikipedia / Wikidata</div>
    ${renderWikiBlock(e.wiki)}

    <div class="section-title">Research attributes</div>
    ${renderResearchAttrs(e.research_attrs)}

    <div class="section-title">Topic motifs (${topicMotifs.length})</div>
    <div class="topic-chips">${topicChips}</div>

    <div class="section-title">Robot features</div>
    ${featureRows}

    <div class="section-title">Papers (${sortedPapers.length}) — sorted by priority then year</div>
    ${paperCards}
  `;
}

// The fields we'd like to display from Wikidata, in this order.
// Labels are user-friendly translations of the WD property names.
const WIKI_FIELD_ORDER = [
  ["instance_of",        "type"],
  ["material_used",      "made of"],
  ["sex_or_gender",      "gender"],
  ["publication_date",   "first publication"],
  ["creator",            "creator"],
  ["author",             "author"],
  ["director",           "director"],
  ["screenwriter",       "screenwriter"],
  ["producer",           "producer"],
  ["voice_actor",        "voice actor"],
  ["performer",          "performer"],
  ["series",             "series"],
  ["part_of",            "part of"],
  ["fictional_universe", "universe"],
  ["present_in_work",    "appears in"],
  ["based_on",           "based on"],
  ["inspired_by",        "inspired by"],
  ["named_after",        "named after"],
  ["occupation",         "occupation"],
  ["has_quality",        "qualities"],
  ["uses",               "uses"],
  ["affiliation",        "affiliation"],
  ["genre",              "genre"],
  ["original_language",  "original language"],
  ["country_of_origin",  "country of origin"],
  ["award",              "award"],
  ["nominated_for",      "nominated for"],
  ["distribution_format","format"],
];

function renderWikiBlock(w) {
  if (!w) {
    return `<div class="wiki-no-match">no confident Wikipedia match yet (the enrichment pass may still be running, or this entity is too niche/generic for a reliable match).</div>`;
  }
  const thumb = w.thumbnail
    ? `<img class="wiki-thumb" src="${escapeAttr(w.thumbnail)}" alt="">`
    : "";
  const title = `<a class="wiki-title" target="_blank" rel="noopener"
                  href="${escapeAttr(w.wiki_url)}">${escapeHtml(w.wiki_title)}<span class="wiki-link-icon">↗</span></a>`;
  const desc = w.description
      ? `<div class="wiki-desc">${escapeHtml(w.description)}</div>`
      : "";
  const extract = w.extract
      ? `<div class="wiki-extract">${escapeHtml(w.extract.slice(0,500))}${w.extract.length > 500 ? "…" : ""}</div>`
      : "";

  let rows = "";
  const wd = w.wd_fields || {};
  for (const [k, label] of WIKI_FIELD_ORDER) {
    if (!wd[k] || !wd[k].length) continue;
    rows += `<tr><th>${label}</th><td>${wd[k].map(escapeHtml).join(", ")}</td></tr>`;
  }
  const metaTable = rows
      ? `<table class="wiki-meta-table">${rows}</table>`
      : "";

  return `
    <div class="wiki-card">
      ${thumb}
      <div class="wiki-body">
        ${title}
        ${desc}
        ${extract}
      </div>
    </div>
    ${metaTable}
  `;
}

function escapeAttr(s) { return escapeHtml(s); }

/* ------ Research attributes rendering ------ */
const ATTR_SECTIONS = [
  { key: "entity_type",          label: "Entity type",          css: "entity"     },
  { key: "material",             label: "Material / composition", css: "material" },
  { key: "embodiment",           label: "Embodiment",           css: "embodiment" },
  { key: "capabilities",         label: "Capabilities",         css: "capability" },
  { key: "narrative_role",       label: "Narrative role",       css: "role"       },
  { key: "consciousness",        label: "Mind / consciousness", css: "mind"       },
  { key: "gender_presentation",  label: "Gender presentation",  css: "gender"     },
  { key: "appears_in",           label: "Appears in",           css: "appears"    },
  { key: "qualities",            label: "Qualities",            css: "quality"    },
  { key: "based_on",             label: "Based on",             css: "based"      },
  { key: "inspired_by",          label: "Inspired by",          css: "based"      },
  { key: "uses",                 label: "Uses / technology",    css: "capability" },
];

function renderResearchAttrs(attrs) {
  if (!attrs) {
    return `<div class="research-none">No attributes extracted (no Wikipedia match or extract too short).</div>`;
  }
  let html = '<div class="research-attrs">';
  let anyFound = false;
  for (const {key, label, css} of ATTR_SECTIONS) {
    const vals = attrs[key];
    if (!vals || !vals.length) continue;
    anyFound = true;
    html += `<div class="attr-group">`;
    html += `<div class="attr-label">${label}</div>`;
    html += `<div class="attr-chips">`;
    for (const v of vals) {
      html += `<span class="attr-chip ${css}">${escapeHtml(v)}</span>`;
    }
    html += `</div></div>`;
  }
  if (!anyFound) {
    html += `<div class="research-none">No specific attributes detected in Wikipedia text.</div>`;
  }
  html += '</div>';
  return html;
}

function clearPanel() {
  document.getElementById("side-panel").innerHTML = `
    <div class="placeholder">
      Click any node in the network on the left to see its motifs,
      robot features, and the papers that mention it.
    </div>
    <div id="legend"></div>
  `;
  populateLegend();
}

function populateLegend() {
  const el = document.getElementById("legend");
  if (!el) return;
  el.innerHTML = `
    <div class="section-title" style="margin-top:0">Legend</div>
    <div class="topic-chips" style="margin-bottom:10px">
      <span class="topic-chip utopian">utopian motifs</span>
      <span class="topic-chip dystopian">dystopian motifs</span>
      <span class="topic-chip feature">feature motifs</span>
    </div>
    <div style="margin-bottom:6px"><b>Node color:</b> overall valence
       (<span style="color:#27ae60">green=utopian</span>,
        <span style="color:#c0392b">red=dystopian</span>,
        <span style="color:#e67e22">orange=mixed</span>,
        <span style="color:#7f8c8d">gray=neutral</span>).</div>
    <div style="margin-bottom:6px"><b>Node size</b> ∝ # papers mentioning the entity.</div>
    <div style="margin-bottom:6px"><b>Edge</b> = both entities co-listed in the same paper.</div>
    <div><b>Paper priority badges</b>:
       <span class="paper-priority high">hp</span>
       <span class="paper-priority medium">mp</span>
       <span class="paper-priority low">lp</span>
       — match the <code>hp/ mp/ lp/</code> folder organisation.</div>
  `;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

/* ---------- wiring ---------- */
document.getElementById("btn-chars").addEventListener("click", () => {
  if (mode === "characters") return;
  mode = "characters";
  document.getElementById("btn-chars").classList.add("active");
  document.getElementById("btn-works").classList.remove("active");
  render(); clearPanel();
});
document.getElementById("btn-works").addEventListener("click", () => {
  if (mode === "works") return;
  mode = "works";
  document.getElementById("btn-works").classList.add("active");
  document.getElementById("btn-chars").classList.remove("active");
  render(); clearPanel();
});
document.getElementById("min-count").addEventListener("input", e => {
  minCount = +e.target.value;
  document.getElementById("min-count-val").textContent = minCount;
  render();
});
document.getElementById("search").addEventListener("input", e => {
  searchQ = e.target.value.trim().toLowerCase();
  render();
});

render();
clearPanel();
</script>
</body>
</html>
